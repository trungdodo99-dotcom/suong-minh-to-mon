<head>

  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Be Vietnam Pro', sans-serif;
      touch-action: manipulation;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #120a05;
      color: #fdf3e7;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100dvh;
      touch-action: none;
    }
    .wood-bar {
      background: linear-gradient(180deg, rgba(88, 43, 17, 0.95) 0%, rgba(48, 22, 8, 0.95) 100%);
      border-bottom: 2px solid #b07d4f;
      box-shadow: 0 4px 14px rgba(0,0,0,0.75);
    }
    .wood-card {
      background: rgba(34, 18, 9, 0.94);
      border: 2px solid #a47143;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.85);
      backdrop-filter: blur(6px);
    }
    .plaque-badge {
      background: linear-gradient(180deg, #fae2aa 0%, #d4a44c 100%);
      border: 2px solid #5a2e0c;
      color: #381803;
      box-shadow: 0 3px 10px rgba(0,0,0,0.6);
    }
    .dock-btn {
      background: linear-gradient(180deg, #694124 0%, #3d2210 100%);
      border: 1.5px solid #b88454;
      border-radius: 10px;
      transition: transform 0.12s ease, border-color 0.12s ease;
      flex-shrink: 0;
    }
    .dock-btn:active {
      transform: scale(0.93);
      border-color: #ffd166;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="relative w-full h-full overflow-hidden">

  <!-- ==================== 1. THANH HEADER SIÊU GỌN (TỐI ƯU MOBILE) ==================== -->

      <button onclick="toggleProjection()" class="px-2 py-1 rounded bg-[#2e1508] border border-[#a47143] text-[11px] font-bold text-[#ffdf91]">

      <button onclick="toggleNight()" class="px-2 py-1 rounded bg-[#2e1508] border border-[#a47143] text-[11px] font-bold text-[#ffd166]">
        🏮

      <button onclick="resetCameraView()" class="px-2 py-1 rounded bg-[#2e1508] border border-[#a47143] text-[11px] text-[#e5c283]">

  <!-- ==================== 9. SOCKET.IO & ENGINE 2.5D ==================== -->
  <script src="/socket.io/socket.io.js"></script>
  <script>
    // --- 1. ÂM THANH ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    let soundMuted = false;

    function ensureAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function toggleSound() {
      soundMuted = !soundMuted;
      document.getElementById('btnSound').textContent = soundMuted ? '🔇' : '🔊';
    }

    function playWoodKnock(pitch = 1.0) {
      if (soundMuted) return;
      try {
        ensureAudio();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(750 * pitch, now);
        osc.frequency.exponentialRampToValueAtTime(290 * pitch, now + 0.07);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.085);
      } catch (e) {}
    }

    function playBell() {
      if (soundMuted) return;
      try {
        ensureAudio();
        const now = audioCtx.currentTime;
        [220, 440, 660].forEach((f, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(f, now);
          gain.gain.setValueAtTime(0.25 / (i + 1), now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.2 - i * 0.4);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 2.3);
        });
      } catch (e) {}
    }

    // --- 2. TOÀN MÀN HÌNH (FULLSCREEN) KHI XOAY NGANG ---
    function toggleFullScreen() {
      const el = document.documentElement;
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    }

        spawnX: 1.7, spawnY: 6.4,
        floorColor: '#7a4e2d', wallColor: '#c99b68', badgeColor: '#d97706'
      },
      Logistic: {

        deskX: 8.3, deskY: 5.1, deskW: 1.8, deskH: 3.0,

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      if (camOffsetX === 0 && camOffsetY === 0) resetCameraView();
    }
    window.addEventListener('resize', resizeCanvas);

    function resetCameraView() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      if (!isTopDown2D) {
        camZoom = Math.min(w / 1450, h / 820);
        camZoom = Math.max(0.48, Math.min(1.15, camZoom));
        camOffsetX = w * 0.44;
        camOffsetY = h * 0.12;
      } else {
        camZoom = Math.min(w / (MAP_W * 38), (h - 110) / (MAP_H * 38));
        camOffsetX = (w - MAP_W * 38 * camZoom) / 2;
        camOffsetY = 55;
      }
    }

    function worldToScreen(gx, gy, gz = 0) {
      if (isTopDown2D) {
        const cell = 38 * camZoom;
        return { x: camOffsetX + gx * cell, y: camOffsetY + gy * cell };
      }
      const tw = ISO_W * camZoom;
      const th = ISO_H * camZoom;
      return {
        x: camOffsetX + (gx - gy) * (tw / 2),
        y: camOffsetY + (gx + gy) * (th / 2) - gz * camZoom
      };
    }

    function screenToWorld(sx, sy) {
      if (isTopDown2D) {
        const cell = 38 * camZoom;
        return { x: (sx - camOffsetX) / cell, y: (sy - camOffsetY) / cell };
      }
      const tw = ISO_W * camZoom;
      const th = ISO_H * camZoom;
      const dx = sx - camOffsetX;
      const dy = sy - camOffsetY;
      return {
        x: (dx / (tw / 2) + dy / (th / 2)) / 2,
        y: (dy / (th / 2) - dx / (tw / 2)) / 2
      };
    }

    function getZoneAt(gx, gy) {
      for (const z of Object.values(ZONES)) {
        if (gx >= z.rx && gx <= z.rx + z.rw && gy >= z.ry && gy <= z.ry + z.rh) {
          return z;
        }
      }
      return null;
    }

    function buildSmartWaypoints(startX, startY, destX, destY) {
      const cx = Math.max(0.8, Math.min(MAP_W - 0.8, destX));
      const cy = Math.max(1.0, Math.min(MAP_H - 0.8, destY));
      const wp = [];
      const startZ = getZoneAt(startX, startY);
      const endZ = getZoneAt(cx, cy);

      if (startZ && (!endZ || startZ.id !== endZ.id)) {
        wp.push({ x: startZ.doorX, y: startZ.doorY });
        wp.push({ x: startZ.approachX, y: startZ.approachY });
      }
      const startRight = startX > 18.2;
      const endRight = cx > 18.2;
      if (startRight !== endRight) {
        if (!startRight) wp.push({ x: 17.6, y: 9.7 }, { x: 18.8, y: 9.7 });
        else wp.push({ x: 18.8, y: 9.7 }, { x: 17.6, y: 9.7 });
      }
      if (endZ && (!startZ || startZ.id !== endZ.id)) {
        wp.push({ x: endZ.approachX, y: endZ.approachY });
        wp.push({ x: endZ.doorX, y: endZ.doorY });
      }
      wp.push({ x: cx, y: cy });
      return wp;
    }

    function sendMyMove(destX, destY, afterAction = null) {
      const me = players[myId];
      if (!me) return;
      me.waypoints = buildSmartWaypoints(me.x, me.y, destX, destY);
      me.targetX = me.waypoints[0].x;
      me.targetY = me.waypoints[0].y;
      me.afterWalkAction = afterAction;
      me.state = 'walk';

      if (socket) {
        socket.emit('move', {
          x: me.x,
          y: me.y,
          destX,
          destY,
          state: 'walk'
        });
      }
    }

    // --- 5. ĐĂNG NHẬP & HÀNH ĐỘNG ---
    function submitJoinTemple() {
      const nameVal = document.getElementById('loginNameInput').value.trim() || 'Đạo Hữu';
      const deptVal = document.getElementById('loginDeptSelect').value;
      const levelVal = document.getElementById('loginLevelSelect').value;
      const genderEl = document.querySelector('input[name="genderRadio"]:checked');
      const genderVal = genderEl ? genderEl.value : 'M';

      const z = ZONES[deptVal] || ZONES['IBD Cost'];
      const sx = z.spawnX + (Math.random() - 0.5) * 0.6;
      const sy = z.spawnY + (Math.random() - 0.5) * 0.6;

      ensureAudio();
      playBell();

      if (socket) {
        myId = socket.id;
        socket.emit('join_temple', {
          name: nameVal,
          dept: deptVal,
          level: levelVal,
          gender: genderVal,
          x: sx,
          y: sy
        });
      }
      document.getElementById('loginModal').classList.add('hidden');
    }

    function performMyAction(type) {
      const me = players[myId];
      if (!me) return;

      if (type === 'meditate') {
        const currentRoom = getZoneAt(me.x, me.y);
        const roomDept = currentRoom ? currentRoom.deptKey : null;
        me.waypoints = [];
        me.state = 'meditate';
        playBell();
        if (socket) {
          socket.emit('meditate_room', { roomDept, x: me.x, y: me.y });
        }
        return;
      }

      if (type === 'incense') {
        sendMyMove(INCENSE_ALTAR.standX + (Math.random() - 0.5) * 0.6, INCENSE_ALTAR.standY, 'do_incense');
        return;
      }

      if (type === 'eat') {
        sendMyMove(ZONES.PANTRY.eatX + (Math.random() - 0.5) * 0.7, ZONES.PANTRY.eatY, 'do_eat');
        return;
      }

      if (type === 'waterfall') {
        sendMyMove(KOI_POND.standX + (Math.random() - 0.5) * 0.8, KOI_POND.standY, 'do_waterfall');
        return;
      }

      if (type === 'leave') {
        // Đi ra Cầu Thang Hạ Sơn để Out Nick
        sendMyMove(ZONES.STAIRS.exitX, ZONES.STAIRS.exitY, 'do_logout');
        spawnFloatText(me.x, me.y, '🏃 Đang ra Cầu Thang Hạ Sơn...', '#ff9b85');
        return;
      }

      playWoodKnock();
      if (socket) socket.emit('action', { type });
    }

      closeTargetMenu();
      document.getElementById('loginModal').classList.remove('hidden');

    // --- 6. TƯƠNG TÁC CẬN CHIẾN (ĐẤM / HÔN) ---
    function selectTargetPlayer(targetId) {
      if (!targetId || targetId === myId || !players[targetId]) return;
      selectedTargetId = targetId;
      const t = players[targetId];
      document.getElementById('targetPlayerName').textContent = `[${t.level}] ${t.name}`;
      document.getElementById('targetPlayerHp').textContent = `(${t.hp} HP)`;
      document.getElementById('targetActionMenu').classList.remove('hidden');
    }

    function closeTargetMenu() {
      selectedTargetId = null;
      pendingInteraction = null;
      document.getElementById('targetActionMenu').classList.add('hidden');
    }

    function triggerProximityInteraction(type) {
      const me = players[myId];
      const target = players[selectedTargetId];
      if (!me || !target) {
        closeTargetMenu();
        return;
      }

      const dist = Math.hypot(me.x - target.x, me.y - target.y);
      if (dist <= 2.3) {
        // Đã đứng gần -> Tương tác ngay!
        playWoodKnock(type === 'punch' ? 0.65 : 1.35);
        socket.emit('interact_target', {
          targetId: target.id,
          type,
          myX: me.x,
          myY: me.y
        });
      } else {
        // Đang ở xa -> Tự động chạy lại gần mục tiêu rồi mới Đấm / Hôn
        pendingInteraction = { targetId: target.id, type };
        sendMyMove(target.x + (me.x < target.x ? -0.7 : 0.7), target.y);
        spawnFloatText(me.x, me.y, type === 'punch' ? '🏃 Đang lao tới đấm!' : '🏃 Đang chạy tới hôn!', '#ffd166');
      }
    }

    function renderOnlineList() {

    function spawnFloatText(gx, gy, text, color = '#ffd166') {
      floatingTexts.push({ gx, gy, gz: 48, text, color, life: 75 });
    }

    // --- 8. SOCKET LISTENERS ---
    if (socket) {
      socket.on('init_state', ({ templeState, players: serverPlayers }) => {
        myId = socket.id;
        activeIncenseSticks = templeState.activeIncenseSticks || 9;
        players = {};
        Object.values(serverPlayers || {}).forEach(p => {
          players[p.id] = { ...p, waypoints: [], targetX: p.x, targetY: p.y };
        });
        document.getElementById('fullChatLog').innerHTML = '';
        (templeState.chatHistory || []).forEach(item => appendChatUI(item));
        renderOnlineList();
      });

      socket.on('players_sync', (serverPlayers) => {
        myId = socket.id;
        const updated = {};
        Object.values(serverPlayers || {}).forEach(sp => {
          const existing = players[sp.id];
          if (existing) {
            updated[sp.id] = {
              ...existing,
              ...sp,
              x: sp.id === myId ? existing.x : sp.x,
              y: sp.id === myId ? existing.y : sp.y
            };
          } else {
            updated[sp.id] = { ...sp, waypoints: [], targetX: sp.x, targetY: sp.y };
          }
        });
        players = updated;
        renderOnlineList();
      });

      socket.on('player_moved', ({ id, x, y, destX, destY }) => {
        const p = players[id];
        if (!p || id === myId) return;
        p.waypoints = buildSmartWaypoints(p.x, p.y, destX, destY);
        p.targetX = p.waypoints[0].x;
        p.targetY = p.waypoints[0].y;
        p.state = 'walk';
      });

      socket.on('player_action', ({ id, type }) => {
        if (players[id]) players[id].state = type;
      });

      socket.on('effect_event', (ev) => {
        if (ev.type === 'incense_burn') {
          activeIncenseSticks = ev.sticks || activeIncenseSticks;
          playBell();
        } else if (ev.type === 'punch_hit') {
          playWoodKnock(0.6);
        } else if (ev.type === 'kiss_heart') {
          playWoodKnock(1.4);
          for (let i = 0; i < 8; i++) {
            heartParticles.push({
              gx: ev.x + (Math.random() - 0.5) * 0.6,
              gy: ev.y + (Math.random() - 0.5) * 0.6,
              gz: 25 + Math.random() * 15,
              life: 60
            });
          }
        } else if (ev.type === 'ko_blast') {
          playBell();
          // Nếu bản thân bị đấm gục thì đưa về phòng ban của mình
          const me = players[myId];
          if (me && Math.hypot(me.x - ev.x, me.y - ev.y) < 1.5) {
            const homeZ = ZONES[me.dept] || ZONES['IBD Cost'];
            me.x = homeZ.spawnX;
            me.y = homeZ.spawnY;
            me.waypoints = [];
            socket.emit('sync_pos', { x: me.x, y: me.y, state: 'idle' });
          }
        }
        if (ev.text) spawnFloatText(ev.x, ev.y, ev.text, ev.color);
      });

      socket.on('chat_message', (item) => {
        if (players[item.id]) {
          players[item.id].bubbleText = item.text;
          players[item.id].bubbleTimer = 220;
        }
        appendChatUI(item);
      });
    }

    // --- 9. ĐIỀU KHIỂN CẢM ỨNG (TOUCH) & CHUỘT ---
    let isDragging = false;
    let startX = 0, startY = 0, movedDist = 0;
    let pinchStartDist = 0, pinchStartZoom = 1;

    function handlePointerDown(cx, cy) {
      isDragging = true;
      startX = cx;
      startY = cy;
      movedDist = 0;
    }

    function handlePointerMove(cx, cy) {
      if (!isDragging) return;
      const dx = cx - startX;
      const dy = cy - startY;
      movedDist += Math.hypot(dx, dy);
      camOffsetX += dx;
      camOffsetY += dy;
      startX = cx;
      startY = cy;
    }

    function handlePointerUp(cx, cy) {
      if (!isDragging) return;
      isDragging = false;
      if (movedDist < 9) handleTapOnCanvas(cx, cy);
    }

    canvas.addEventListener('mousedown', e => handlePointerDown(e.clientX, e.clientY));
    window.addEventListener('mousemove', e => handlePointerMove(e.clientX, e.clientY));
    window.addEventListener('mouseup', e => handlePointerUp(e.clientX, e.clientY));

    canvas.addEventListener('touchstart', e => {
      if (e.touches.length === 2) {
        isDragging = false;
        pinchStartDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        pinchStartZoom = camZoom;
      } else if (e.touches.length === 1) {
        handlePointerDown(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });

    canvas.addEventListener('touchmove', e => {
      if (e.touches.length === 2 && pinchStartDist > 0) {
        const d = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        camZoom = Math.max(0.45, Math.min(1.5, pinchStartZoom * (d / pinchStartDist)));
      } else if (e.touches.length === 1) {
        handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });

    canvas.addEventListener('touchend', e => {
      if (e.changedTouches.length === 1) {
        handlePointerUp(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
      }
    });

    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      camZoom = Math.max(0.45, Math.min(1.6, camZoom * (e.deltaY < 0 ? 1.08 : 0.92)));
    }, { passive: false });

    function handleTapOnCanvas(sx, sy) {
      if (!myId || !players[myId]) return;

      // 1. Kiểm tra xem có chạm vào người chơi khác để Đấm / Hôn không
      const pList = Object.values(players);
      for (let i = pList.length - 1; i >= 0; i--) {
        const p = pList[i];
        if (p.id === myId) continue;
        const sp = worldToScreen(p.x, p.y, 18);
        if (Math.hypot(sx - sp.x, sy - sp.y) < 28 * camZoom) {
          selectTargetPlayer(p.id);
          return;
        }
      }

      closeTargetMenu();
      const wp = screenToWorld(sx, sy);

      // 2. Chạm vào Đỉnh Hương
      if (Math.hypot(wp.x - INCENSE_ALTAR.x, wp.y - INCENSE_ALTAR.y) < 1.35) {
        performMyAction('incense');
        return;
      }

      // 3. Chạm vào Hồ Cá Koi
      if (wp.x >= KOI_POND.x && wp.x <= KOI_POND.x + KOI_POND.w && wp.y >= KOI_POND.y && wp.y <= KOI_POND.y + KOI_POND.h) {
        performMyAction('waterfall');
        return;
      }

      // 4. Chạm vào Phòng Pantry (Tủ Lạnh / Bàn Ăn)
      const pt = ZONES.PANTRY;
      if (wp.x >= pt.rx && wp.x <= pt.rx + pt.rw && wp.y >= pt.ry && wp.y <= pt.ry + pt.rh) {
        performMyAction('eat');
        return;
      }

      // 5. Chạm vào Cầu Thang Hạ Sơn -> Đi ra Out Nick
      const st = ZONES.STAIRS;
      if (wp.x >= st.rx && wp.x <= st.rx + st.rw && wp.y >= st.ry && wp.y <= st.ry + st.rh) {
        performMyAction('leave');
        return;
      }

      // 6. Di chuyển bình thường
      if (wp.x >= 0.6 && wp.x <= MAP_W - 0.6 && wp.y >= 0.6 && wp.y <= MAP_H - 0.6) {
        sendMyMove(wp.x, wp.y);
        spawnFloatText(wp.x, wp.y, '📍 Đi tới đây', '#fde68a');
      }
    }

    function toggleProjection() {
      isTopDown2D = !isTopDown2D;
      document.getElementById('projLabel').textContent = isTopDown2D ? '2D' : '2.5D';
      resetCameraView();
    }

    function toggleNight() {
      isNightMode = !isNightMode;
    }

    // --- 10. VÒNG LẶP VẬT LÝ & ĐỒ HỌA 2.5D CHI TIẾT ---
    function updateSimulation() {
      simTick++;

      waterfallDrops.forEach(d => {
        d.prog += d.speed;
        if (d.prog >= 1) d.prog = 0;
      });
      koiFish.forEach(k => { k.a += k.sp; });

      if (simTick % 6 === 0) {
        smokeParticles.push({
          gx: INCENSE_ALTAR.x + (Math.random() - 0.5) * 0.25,
          gy: INCENSE_ALTAR.y + (Math.random() - 0.5) * 0.25,
          gz: 24,
          alpha: 0.75,
          size: 3 + Math.random() * 3
        });
      }
      smokeParticles.forEach(s => {
        s.gz += 0.35;
        s.gx += Math.sin(simTick * 0.05 + s.gz) * 0.008;
        s.alpha -= 0.009;
      });
      smokeParticles = smokeParticles.filter(s => s.alpha > 0);

      heartParticles.forEach(h => {
        h.gz += 0.45;
        h.life--;
      });
      heartParticles = heartParticles.filter(h => h.life > 0);

      floatingTexts.forEach(f => {
        f.gz += 0.5;
        f.life--;
      });
      floatingTexts = floatingTexts.filter(f => f.life > 0);

      // Cập nhật di chuyển của tất cả người chơi
      Object.values(players).forEach(p => {
        if (p.bubbleTimer > 0) {
          p.bubbleTimer--;
          if (p.bubbleTimer === 0) p.bubbleText = '';
        }

        if (p.waypoints && p.waypoints.length > 0) {
          const tx = p.waypoints[0].x;
          const ty = p.waypoints[0].y;
          const dx = tx - p.x;
          const dy = ty - p.y;
          const dist = Math.hypot(dx, dy);

          if (dist > 0.07) {
            p.x += (dx / dist) * 0.075;
            p.y += (dy / dist) * 0.075;
            p.state = 'walk';
          } else {
            p.x = tx;
            p.y = ty;
            p.waypoints.shift();

            if (p.waypoints.length === 0) {
              if (p.id === myId) {
                if (p.afterWalkAction === 'do_incense') {
                  p.afterWalkAction = null;
                  socket.emit('action', { type: 'incense' });
                } else if (p.afterWalkAction === 'do_eat') {
                  p.afterWalkAction = null;
                  socket.emit('action', { type: 'eat' });
                } else if (p.afterWalkAction === 'do_waterfall') {
                  p.afterWalkAction = null;
                  socket.emit('action', { type: 'waterfall' });
                } else if (p.afterWalkAction === 'do_logout') {
                  p.afterWalkAction = null;
                  executeLogoutHason();
                  return;
                }
                socket.emit('sync_pos', { x: p.x, y: p.y, state: 'idle' });
              }
              if (p.state === 'walk') p.state = 'idle';
            }
          }
        }

        // Kiểm tra nếu đang chạy lại gần để Đấm / Hôn
        if (p.id === myId && pendingInteraction) {
          const target = players[pendingInteraction.targetId];
          if (!target) {
            pendingInteraction = null;
          } else if (Math.hypot(p.x - target.x, p.y - target.y) <= 2.2) {
            const actType = pendingInteraction.type;
            const tId = target.id;
            pendingInteraction = null;
            p.waypoints = [];
            socket.emit('interact_target', {
              targetId: tId,
              type: actType,
              myX: p.x,
              myY: p.y
            });
          }
        }
      });

      if (simTick % 30 === 0 && myId && players[myId] && socket) {
        const me = players[myId];
        socket.emit('sync_pos', { x: me.x, y: me.y, state: me.state });
      }
    }

    // --- 11. CÁC HÀM VẼ KIẾN TRÚC & NHÂN VẬT THEO TU VI ---
    function drawIsoBlock(gx, gy, w, d, h, topCol, leftCol, rightCol, strokeCol = null) {
      if (isTopDown2D) {
        const p1 = worldToScreen(gx, gy);
        const p2 = worldToScreen(gx + w, gy + d);
        ctx.fillStyle = topCol;
        ctx.fillRect(p1.x, p1.y, p2.x - p1.x, p2.y - p1.y);
        return;
      }
      const p1 = worldToScreen(gx, gy, h);
      const p2 = worldToScreen(gx + w, gy, h);
      const p3 = worldToScreen(gx + w, gy + d, h);
      const p4 = worldToScreen(gx, gy + d, h);
      const b2 = worldToScreen(gx + w, gy, 0);
      const b3 = worldToScreen(gx + w, gy + d, 0);
      const b4 = worldToScreen(gx, gy + d, 0);

      ctx.fillStyle = leftCol;
      ctx.beginPath(); ctx.moveTo(p4.x, p4.y); ctx.lineTo(p3.x, p3.y); ctx.lineTo(b3.x, b3.y); ctx.lineTo(b4.x, b4.y); ctx.closePath(); ctx.fill();
      ctx.fillStyle = rightCol;
      ctx.beginPath(); ctx.moveTo(p2.x, p2.y); ctx.lineTo(p3.x, p3.y); ctx.lineTo(b3.x, b3.y); ctx.lineTo(b2.x, b2.y); ctx.closePath(); ctx.fill();
      ctx.fillStyle = topCol;
      ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.lineTo(p3.x, p3.y); ctx.lineTo(p4.x, p4.y); ctx.closePath(); ctx.fill();
      if (strokeCol) {
        ctx.strokeStyle = strokeCol;
        ctx.lineWidth = 0.8 * camZoom;
        ctx.stroke();
      }
    }

    function drawFloorCarpet(gx, gy, w, d, fillCol, borderCol) {
      const p1 = worldToScreen(gx, gy, 0.4);
      const p2 = worldToScreen(gx + w, gy, 0.4);
      const p3 = worldToScreen(gx + w, gy + d, 0.4);
      const p4 = worldToScreen(gx, gy + d, 0.4);
      ctx.fillStyle = fillCol;
      ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.lineTo(p3.x, p3.y); ctx.lineTo(p4.x, p4.y); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = borderCol;
      ctx.lineWidth = 1.8 * camZoom;
      ctx.stroke();
    }

    function drawRoomAndDoor(z) {
      const { rx, ry, rw, rh, doorX, doorY, doorSide, floorColor, wallColor, badgeColor, title } = z;
      const wt = 0.22;
      const bh = 22;
      const fh = 11;
      const gap = 0.95;

      drawFloorCarpet(rx + 0.08, ry + 0.08, rw - 0.16, rh - 0.16, floorColor, badgeColor);

      if (doorSide === 'north') {
        drawIsoBlock(rx, ry, (doorX - gap) - rx, wt, bh, wallColor, '#8c5a32', '#6b4223');
        drawIsoBlock(doorX + gap, ry, (rx + rw) - (doorX + gap), wt, bh, wallColor, '#8c5a32', '#6b4223');
      } else {
        drawIsoBlock(rx, ry, rw, wt, bh, wallColor, '#8c5a32', '#6b4223');
      }
      drawIsoBlock(rx, ry, wt, rh, bh, wallColor, '#8c5a32', '#6b4223');
      drawIsoBlock(rx + rw - wt, ry, wt, rh, fh, wallColor, '#8c5a32', '#6b4223');

      if (doorSide === 'south') {
        drawIsoBlock(rx, ry + rh - wt, (doorX - gap) - rx, wt, fh, wallColor, '#8c5a32', '#6b4223');
        drawIsoBlock(doorX + gap, ry + rh - wt, (rx + rw) - (doorX + gap), wt, fh, wallColor, '#8c5a32', '#6b4223');
      } else {
        drawIsoBlock(rx, ry + rh - wt, rw, wt, fh, wallColor, '#8c5a32', '#6b4223');
      }

      if (z.deskX !== undefined) {
        drawIsoBlock(z.deskX, z.deskY, z.deskW, z.deskH, 13, '#c89666', '#9c6b3f', '#7a502c', '#4a2c11');
      }

      // Cổng vòm & Biển tên ngắn gọn
      drawIsoBlock(doorX - 0.85, doorY - 0.2, 1.7, 0.4, 2, '#fcd34d', '#d97706', '#92400e');
      if (!isTopDown2D) {
        drawIsoBlock(doorX - 0.85, doorY - 0.12, 0.2, 0.24, 32, '#dc2626', '#991b1b', '#7f1d1d');
        drawIsoBlock(doorX + 0.65, doorY - 0.12, 0.2, 0.24, 32, '#dc2626', '#991b1b', '#7f1d1d');
      }

      const pos = worldToScreen(doorX, doorY, isTopDown2D ? 0 : 36);
      ctx.save();
      ctx.font = `800 ${Math.max(9, Math.round(10.5 * camZoom))}px 'Be Vietnam Pro', sans-serif`;
      ctx.textAlign = 'center';
      const tw = ctx.measureText(title).width + 14 * camZoom;
      const th = 19 * camZoom;
      ctx.fillStyle = 'rgba(24, 12, 5, 0.92)';
      ctx.beginPath();
      ctx.roundRect(pos.x - tw / 2, pos.y - th / 2, tw, th, 5 * camZoom);
      ctx.fill();
      ctx.strokeStyle = badgeColor;
      ctx.lineWidth = 1.8 * camZoom;
      ctx.stroke();
      ctx.fillStyle = '#ffd166';
      ctx.fillText(title, pos.x, pos.y + 3.5 * camZoom);
      ctx.restore();
    }

    // Vẽ Hồ Cá Koi & Thác Nước Linh Sơn Nâng Cấp
    function drawKoiPondAndWaterfall() {
      const kz = KOI_POND;
      // Thành hồ đá xanh ngọc
      drawIsoBlock(kz.x, kz.y, kz.w, kz.h, 3.5, '#0d9488', '#0f766e', '#115e59', '#5eead4');
      drawFloorCarpet(kz.x + 0.2, kz.y + 0.2, kz.w - 0.4, kz.h - 0.4, '#0369a1', '#38bdf8');

      // Đàn cá Koi bơi lội
      koiFish.forEach(k => {
        const fx = k.cx + Math.cos(k.a) * k.rx;
        const fy = k.cy + Math.sin(k.a) * k.ry;
        const fp = worldToScreen(fx, fy, 2);
        const ang = Math.atan2(Math.cos(k.a) * k.ry, -Math.sin(k.a) * k.rx);
        ctx.save();
        ctx.translate(fp.x, fp.y);
        ctx.rotate(ang);
        ctx.fillStyle = k.c;
        ctx.beginPath();
        ctx.ellipse(0, 0, 6.5 * camZoom, 3 * camZoom, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = k.spot;
        ctx.beginPath();
        ctx.arc(1.5 * camZoom, 0, 2 * camZoom, 0, Math.PI * 2);
        ctx.fill();
        // Đuôi cá vẫy
        const wag = Math.sin(simTick * 0.35 + k.a) * 2.5 * camZoom;
        ctx.fillStyle = k.c;
        ctx.beginPath();
        ctx.moveTo(-6 * camZoom, 0);
        ctx.lineTo(-10.5 * camZoom, -3 * camZoom + wag);
        ctx.lineTo(-10.5 * camZoom, 3 * camZoom + wag);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      });

      // Lá sen & Hoa sen hồng
      [
        { x: 2.1, y: 2.9, flower: true },
        { x: 4.9, y: 2.8, flower: true },
        { x: 5.4, y: 1.9, flower: false },
        { x: 2.6, y: 3.5, flower: true }
      ].forEach(lt => {
        const lp = worldToScreen(lt.x, lt.y, 2.5);
        ctx.fillStyle = '#15803d';
        ctx.beginPath();
        ctx.ellipse(lp.x, lp.y, 8.5 * camZoom, 4.8 * camZoom, 0, 0, Math.PI * 1.85);
        ctx.fill();
        if (lt.flower) {
          ctx.fillStyle = '#f472b6';
          ctx.beginPath();
          ctx.arc(lp.x, lp.y - 3 * camZoom, 4.5 * camZoom, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#fef08a';
          ctx.beginPath();
          ctx.arc(lp.x, lp.y - 3 * camZoom, 1.8 * camZoom, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      // Cầu gỗ đỏ Nhật Bản bắc qua góc hồ
      drawIsoBlock(5.3, 2.5, 1.0, 1.4, 6, '#dc2626', '#991b1b', '#7f1d1d', '#fbbf24');

      // Núi đá thác nước 3 tầng
      drawIsoBlock(0.8, 0.6, 4.8, 1.1, 38, '#64748b', '#475569', '#334155');
      drawIsoBlock(1.1, 0.85, 4.0, 0.9, 24, '#475569', '#334155', '#1e293b');

      if (!isTopDown2D) {
        [1.8, 2.9, 4.0].forEach(sx => {
          const topP = worldToScreen(sx, 1.1, 36);
          const botP = worldToScreen(sx, 2.0, 3);
          ctx.strokeStyle = 'rgba(125, 211, 252, 0.85)';
          ctx.lineWidth = 10 * camZoom;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(topP.x, topP.y);
          ctx.lineTo(botP.x, botP.y);
          ctx.stroke();
        });
        waterfallDrops.forEach(d => {
          const sx = 1.8 + d.stream * 1.1 + d.offX;
          const sy = 1.1 + d.prog * 0.9;
          const sz = 36 * (1 - d.prog) + 3;
          const p = worldToScreen(sx, sy, sz);
          ctx.fillStyle = '#e0f2fe';
          ctx.beginPath();
          ctx.arc(p.x, p.y, d.size * camZoom, 0, Math.PI * 2);
          ctx.fill();
        });
      }
    }

    // Vẽ Phòng Pantry Chi Tiết (Tủ Lạnh 2 Cánh + Bàn Ăn Thụ Lộc)

    // Vẽ Đôi Cánh Vẫy Vẫy (Chỉ dành cho AM và Manager)
    function drawAngelWings(cx, cy, scale, isManager) {
      const flap = Math.sin(simTick * 0.22) * 0.38;
      const wingSpan = (isManager ? 26 : 19) * scale;
      const wingH = (isManager ? 22 : 16) * scale;

      [-1, 1].forEach(dir => {
        ctx.save();
        ctx.translate(cx + dir * 5 * scale, cy);
        ctx.rotate(dir * (0.35 + flap));

        const grad = ctx.createLinearGradient(0, 0, dir * wingSpan, -wingH);
        if (isManager) {
          grad.addColorStop(0, '#fef08a');
          grad.addColorStop(0.6, '#f59e0b');
          grad.addColorStop(1, '#dc2626');
        } else {
          grad.addColorStop(0, '#ffffff');
          grad.addColorStop(0.6, '#7dd3fc');
          grad.addColorStop(1, '#38bdf8');
        }

        ctx.fillStyle = grad;
        ctx.strokeStyle = isManager ? '#fde047' : '#bae6fd';
        ctx.lineWidth = 1.4 * scale;

        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(dir * wingSpan * 0.6, -wingH * 1.1, dir * wingSpan, -wingH * 0.35);
        ctx.quadraticCurveTo(dir * wingSpan * 0.75, wingH * 0.2, dir * wingSpan * 0.55, wingH * 0.45);
        ctx.quadraticCurveTo(dir * wingSpan * 0.25, wingH * 0.3, 0, 4 * scale);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      });
    }

    // Vẽ Nhân Vật Theo Cấp Bậc Tu Vi + Thanh Máu 100 HP
    function drawPlayerCharacter(p) {
      const isMe = p.id === myId;
      const isTarget = p.id === selectedTargetId;
      const bounce = p.state === 'walk' ? Math.abs(Math.sin(simTick * 0.28)) * 5 : 0;
      const pos = worldToScreen(p.x, p.y, bounce);
      const sc = camZoom;

      ctx.save();

      // 1. Hào quang dưới chân theo cấp bậc Tu Vi
      if (p.level === 'Group Lead' || p.level === 'AM' || p.level === 'Manager') {
        const auraR = (p.level === 'Manager' ? 22 : (p.level === 'AM' ? 18 : 14)) * sc;
        ctx.fillStyle = p.level === 'Manager'
          ? 'rgba(250, 204, 21, 0.35)'
          : (p.level === 'AM' ? 'rgba(56, 189, 248, 0.32)' : 'rgba(192, 132, 252, 0.28)');
        ctx.beginPath();
        ctx.ellipse(pos.x, pos.y + 1 * sc, auraR, auraR * 0.5, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      if (isMe || isTarget) {
        ctx.strokeStyle = isMe ? '#00f5d4' : '#ff4d4d';
        ctx.lineWidth = 2.2 * sc;
        ctx.beginPath();
        ctx.ellipse(pos.x, pos.y, 16 * sc, 8.5 * sc, 0, 0, Math.PI * 2);
        ctx.stroke();
      }

      // 2. Đôi cánh vẫy vẫy từ cấp AM trở lên (AM & Manager)
      if (p.level === 'AM' || p.level === 'Manager') {
        drawAngelWings(pos.x, pos.y - 16 * sc, sc, p.level === 'Manager');
      }

      // 3. Đài sen khi Tọa Thiền
      if (p.state === 'meditate') {
        ctx.fillStyle = '#f59e0b';
        ctx.strokeStyle = '#fde047';
        ctx.lineWidth = 1.5 * sc;
        ctx.beginPath();
        ctx.ellipse(pos.x, pos.y + 1 * sc, 15 * sc, 7.5 * sc, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }

      // 4. Thân áo theo Tu Vi (cấp càng cao áo càng đẹp)
      const bodyW = 14.5 * sc;
      const bodyH = (p.state === 'meditate' ? 15 : 19) * sc;
      let robeCol = '#475569'; // ST2
      let trimCol = '#94a3b8';
      if (p.level === 'ST3') { robeCol = '#0284c7'; trimCol = '#bae6fd'; }
      else if (p.level === 'Group Lead') { robeCol = '#7c3aed'; trimCol = '#fde047'; }
      else if (p.level === 'AM') { robeCol = '#ea580c'; trimCol = '#fef08a'; }
      else if (p.level === 'Manager') { robeCol = '#b91c1c'; trimCol = '#fde047'; }

      ctx.fillStyle = robeCol;
      ctx.beginPath();
      ctx.roundRect(pos.x - bodyW / 2, pos.y - bodyH - 3 * sc, bodyW, bodyH, 5 * sc);
      ctx.fill();
      ctx.strokeStyle = trimCol;
      ctx.lineWidth = 1.8 * sc;
      ctx.stroke();

      // Dải cà sa / đai vàng cho cấp cao
      if (p.level !== 'ST2') {
        ctx.strokeStyle = trimCol;
        ctx.lineWidth = 2 * sc;
        ctx.beginPath();
        ctx.moveTo(pos.x - 5 * sc, pos.y - bodyH - 1 * sc);
        ctx.lineTo(pos.x + 5 * sc, pos.y - 5 * sc);
        ctx.stroke();
      }

      // 5. Đầu & Mão/Vương miện Tu Vi
      const headY = pos.y - bodyH - 11 * sc;
      const headR = 9 * sc;
      ctx.fillStyle = '#fed7aa';
      ctx.beginPath();
      ctx.arc(pos.x, headY, headR, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#431407';
      ctx.lineWidth = 1 * sc;
      ctx.stroke();

      // Tóc
      ctx.fillStyle = p.gender === 'F' ? '#3f1d0b' : '#1e293b';
      ctx.beginPath();
      ctx.arc(pos.x, headY - 1.5 * sc, headR + 0.5 * sc, Math.PI, Math.PI * 2);
      ctx.fill();

      // Kim quan (Mão vàng) cho Group Lead, AM, Manager
      if (p.level === 'Group Lead' || p.level === 'AM' || p.level === 'Manager') {
        ctx.fillStyle = '#fbbf24';
        ctx.strokeStyle = '#78350f';
        ctx.lineWidth = 1 * sc;
        ctx.beginPath();
        ctx.moveTo(pos.x - 5 * sc, headY - 9 * sc);
        ctx.lineTo(pos.x, headY - 15 * sc);
        ctx.lineTo(pos.x + 5 * sc, headY - 9 * sc);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }

      // 6. Thanh Máu (100 HP Bar)
      const barW = 32 * sc;
      const barH = 4.5 * sc;
      const barX = pos.x - barW / 2;
      const barY = headY - 19 * sc;
      const hpRatio = Math.max(0, Math.min(1, (p.hp ?? 100) / 100));

      ctx.fillStyle = 'rgba(0,0,0,0.75)';
      ctx.fillRect(barX - 1, barY - 1, barW + 2, barH + 2);
      ctx.fillStyle = hpRatio > 0.5 ? '#22c55e' : (hpRatio > 0.25 ? '#f59e0b' : '#ef4444');
      ctx.fillRect(barX, barY, barW * hpRatio, barH);

      // 7. Pháp danh & Phòng ban
      const nameY = barY - 4 * sc;
      ctx.font = `800 ${Math.max(8, Math.round(9.5 * sc))}px 'Be Vietnam Pro', sans-serif`;
      ctx.textAlign = 'center';
      const labelStr = `[${p.level}] ${p.name}`;
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2.8 * sc;
      ctx.strokeText(labelStr, pos.x, nameY);
      ctx.fillStyle = isMe ? '#00f5d4' : '#ffffff';
      ctx.fillText(labelStr, pos.x, nameY);

      // 8. Bong bóng hội thoại
      if (p.bubbleText) {
        ctx.font = `700 ${Math.max(8, Math.round(9.5 * sc))}px 'Be Vietnam Pro', sans-serif`;
        const tw = ctx.measureText(p.bubbleText).width + 14 * sc;
        const th = 18 * sc;
        const bx = pos.x - tw / 2;
        const by = nameY - 24 * sc;
        ctx.fillStyle = '#fffbeb';
        ctx.beginPath();
        ctx.roundRect(bx, by, tw, th, 5 * sc);
        ctx.fill();
        ctx.strokeStyle = '#78350f';
        ctx.lineWidth = 1.2 * sc;
        ctx.stroke();
        ctx.fillStyle = '#1c1917';
        ctx.fillText(p.bubbleText, pos.x, by + 12.5 * sc);
      }

      ctx.restore();
    }

    function renderScene() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. Nền gạch sân chùa
      for (let gx = 0; gx < MAP_W; gx++) {
        for (let gy = 0; gy < MAP_H; gy++) {
          const p1 = worldToScreen(gx, gy);
          const p2 = worldToScreen(gx + 1, gy);
          const p3 = worldToScreen(gx + 1, gy + 1);
          const p4 = worldToScreen(gx, gy + 1);
          const isAvenue = gy >= 9 && gy <= 10 && gx < 18;
          ctx.fillStyle = isAvenue
            ? ((gx + gy) % 2 === 0 ? '#57534e' : '#44403c')
            : ((gx + gy) % 2 === 0 ? '#8c562f' : '#7c4a27');
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.lineTo(p3.x, p3.y); ctx.lineTo(p4.x, p4.y);
          ctx.closePath();
          ctx.fill();
        }
      }

      // 2. Hồ Cá Koi & Thác Nước
      drawKoiPondAndWaterfall();

      // 3. Chánh Điện & Tượng Phật Vàng
      drawRoomAndDoor(ZONES.DIRECTOR);
      const statuePos = worldToScreen(11.8, 1.2, 24);
      if (!isTopDown2D) {
        ctx.fillStyle = '#fbbf24';
        ctx.beginPath();
        ctx.arc(statuePos.x, statuePos.y - 16 * camZoom, 18 * camZoom, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#f59e0b';
        ctx.beginPath();
        ctx.roundRect(statuePos.x - 11 * camZoom, statuePos.y - 20 * camZoom, 22 * camZoom, 20 * camZoom, 7 * camZoom);
        ctx.fill();
      }

      // 4. 6 Phòng Ban
      drawRoomAndDoor(ZONES.PROC);
      drawRoomAndDoor(ZONES.Logistic);
      drawRoomAndDoor(ZONES['HR-GA']);
      drawRoomAndDoor(ZONES.Tech);
      drawRoomAndDoor(ZONES['IBD Cost']);
      drawRoomAndDoor(ZONES['IBD Sale']);

      // 5. Đỉnh Hương Trung Tâm
      drawFloorCarpet(INCENSE_ALTAR.x - 1.3, INCENSE_ALTAR.y - 0.9, 2.6, 1.8, '#7f1d1d', '#fbbf24');
      drawIsoBlock(INCENSE_ALTAR.x - 0.7, INCENSE_ALTAR.y - 0.4, 1.4, 0.8, 14, '#b45309', '#78350f', '#451a03', '#fde047');

      // 6. Pantry (Tủ lạnh + Bàn ăn) & Cầu Thang Hạ Sơn
      drawPantryDetails();
      drawRoomAndDoor(ZONES.STAIRS);
      const st = ZONES.STAIRS;
      for (let s = 0; s < 6; s++) {
        drawIsoBlock(st.rx + 0.6, st.ry + 0.7 + s * 0.65, st.rw - 1.2, 0.58, (6 - s) * 2.2, '#78716c', '#44403c', '#292524');
      }

      // 7. Vẽ Người Chơi Đang Online (Sắp xếp theo chiều sâu)
      const sortedPlayers = Object.values(players).sort((a, b) => (a.x + a.y) - (b.x + b.y));
      sortedPlayers.forEach(p => drawPlayerCharacter(p));

      // 8. Khói nhang & Tim bay
      smokeParticles.forEach(s => {
        const p = worldToScreen(s.gx, s.gy, s.gz);
        ctx.fillStyle = `rgba(254, 240, 138, ${s.alpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, s.size * camZoom, 0, Math.PI * 2);
        ctx.fill();
      });

      heartParticles.forEach(h => {
        const p = worldToScreen(h.gx, h.gy, h.gz);
        ctx.font = `${Math.round(14 * camZoom)}px sans-serif`;
        ctx.fillText('💖', p.x, p.y);
      });

      if (isNightMode) {
        ctx.fillStyle = 'rgba(8, 10, 26, 0.38)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      // 9. Chữ nổi (+Công Đức, -15 HP, Trộm Công Đức)
      floatingTexts.forEach(fl => {
        const p = worldToScreen(fl.gx, fl.gy, fl.gz);
        ctx.font = `800 ${Math.max(10, Math.round(11.5 * camZoom))}px 'Be Vietnam Pro', sans-serif`;
        ctx.textAlign = 'center';
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 3;
        ctx.strokeText(fl.text, p.x, p.y);
        ctx.fillStyle = fl.color;
        ctx.fillText(fl.text, p.x, p.y);
      });
    }

    function startLoop() {
      resizeCanvas();
      function frame() {
        updateSimulation();
        renderScene();
        requestAnimationFrame(frame);
      }
      frame();
    }

    window.onload = startLoop;
  </script>
</body>
