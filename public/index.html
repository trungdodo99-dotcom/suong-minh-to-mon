<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Là ải là ai? — Đấu Trí Đoán Nhân Vật Yes/No</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg-deep: #05131a;
      --glass: rgba(11, 34, 44, 0.76);
      --glass-strong: rgba(7, 24, 32, 0.92);
      --border: rgba(94, 234, 212, 0.22);
      --accent: #2dd4bf;
      --accent-2: #0ea5e9;
      --gold: #fbbf24;
      --danger: #f87171;
      --success: #4ade80;
      --text: #ecfeff;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'Be Vietnam Pro', system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(circle at 12% 10%, rgba(45, 212, 191, 0.22), transparent 42%),
        radial-gradient(circle at 88% 18%, rgba(14, 165, 233, 0.18), transparent 44%),
        radial-gradient(circle at 50% 95%, rgba(16, 185, 129, 0.15), transparent 48%),
        linear-gradient(150deg, #041016 0%, #09222d 55%, #05161f 100%);
      color: var(--text);
    }

    .glass {
      background: var(--glass);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    .hidden { display: none !important; }

    /* Buttons & Inputs */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 15px;
      border-radius: 12px;
      border: 1px solid transparent;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.16s ease;
      color: var(--text);
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.96); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-primary {
      background: linear-gradient(135deg, #14b8a6, #0284c7);
      box-shadow: 0 4px 16px rgba(20, 184, 166, 0.32);
    }
    .btn-primary:hover:not(:disabled) { filter: brightness(1.08); }

    .btn-ai {
      background: linear-gradient(135deg, #7c3aed, #06b6d4);
      box-shadow: 0 4px 16px rgba(124, 58, 237, 0.32);
    }
    .btn-ai:hover:not(:disabled) { filter: brightness(1.08); }

    .btn-gold {
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      color: #fff;
      box-shadow: 0 4px 16px rgba(245, 158, 11, 0.3);
    }

    .btn-hint {
      background: rgba(251, 191, 36, 0.2);
      border: 1px solid rgba(251, 191, 36, 0.55);
      color: #fde68a;
      padding: 3px 9px;
      font-size: 11.5px;
      border-radius: 999px;
    }
    .btn-hint:hover:not(:disabled) { background: rgba(251, 191, 36, 0.32); }

    .btn-ghost {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255, 255, 255, 0.15);
    }
    .btn-ghost:hover:not(:disabled) { background: rgba(255, 255, 255, 0.14); }

    /* 5 nút trả lời */
    .ans-btn-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }
    .btn-ans-YES { background: linear-gradient(135deg, #16a34a, #10b981); }
    .btn-ans-NO { background: linear-gradient(135deg, #dc2626, #e11d48); }
    .btn-ans-MAYBE { background: linear-gradient(135deg, #d97706, #eab308); color: #0b141a; }
    .btn-ans-PROBABLY_NO { background: linear-gradient(135deg, #ea580c, #f97316); }
    .btn-ans-DONT_KNOW { background: linear-gradient(135deg, #475569, #64748b); }

    input, select {
      width: 100%;
      padding: 11px 14px;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.28);
      background: rgba(5, 18, 24, 0.78);
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus { border-color: var(--accent); }
    select option { background: #0a202b; color: #fff; }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }
    .pill-wait { background: rgba(251, 191, 36, 0.2); color: #fcd34d; }
    .pill-play { background: rgba(74, 222, 128, 0.2); color: #86efac; }
    .pill-ai { background: rgba(167, 139, 250, 0.22); color: #ddd6fe; }
    .pill-pvp { background: rgba(56, 189, 248, 0.2); color: #bae6fd; }
    .pill-done { background: rgba(148, 163, 184, 0.2); color: #cbd5e1; }
    .pill-hard { background: rgba(239, 68, 68, 0.22); color: #fca5a5; }
    .pill-easy { background: rgba(34, 197, 94, 0.2); color: #86efac; }

    /* ================= MÀN HÌNH NHẬP TÊN (KHÔNG CẦN TẠO ACC) ================= */
    #authScreen {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-card { width: 100%; max-width: 420px; padding: 28px; }
    .brand-title {
      font-size: 32px;
      font-weight: 800;
      text-align: center;
      background: linear-gradient(90deg, #5eead4, #38bdf8, #fbbf24);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-sub {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      margin: 6px 0 22px;
    }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 12.5px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; }
    .avatar-picker { display: flex; flex-wrap: wrap; gap: 7px; }
    .avatar-opt {
      width: 40px; height: 40px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.05);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; cursor: pointer;
    }
    .avatar-opt.selected {
      border-color: var(--accent);
      background: rgba(45, 212, 191, 0.26);
      transform: scale(1.08);
    }
    .err-msg {
      color: #fca5a5;
      background: rgba(239, 68, 68, 0.16);
      border: 1px solid rgba(239, 68, 68, 0.35);
      padding: 9px 12px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 14px;
    }

    /* ================= LOBBY SCREEN ================= */
    #lobbyScreen {
      max-width: 980px;
      margin: 0 auto;
      padding: 16px;
      min-height: 100dvh;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      padding: 12px 16px;
      margin-bottom: 14px;
    }
    .user-badge { display: flex; align-items: center; gap: 10px; }
    .user-avatar {
      width: 40px; height: 40px; border-radius: 12px;
      background: rgba(45, 212, 191, 0.18);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    .panel { padding: 18px; margin-bottom: 14px; }
    .panel-title {
      font-size: 15.5px;
      font-weight: 800;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .create-box {
      display: grid;
      grid-template-columns: 1.2fr 1fr 0.9fr;
      gap: 10px;
      margin-bottom: 12px;
    }
    @media (max-width: 720px) { .create-box { grid-template-columns: 1fr; } }
    .room-list { display: flex; flex-direction: column; gap: 10px; }
    .room-item {
      padding: 13px 15px;
      border-radius: 14px;
      background: rgba(5, 19, 26, 0.72);
      border: 1px solid rgba(148, 163, 184, 0.18);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    /* ================= ROOM SCREEN (GIỮ NGUYÊN PC) ================= */
    #roomScreen {
      height: 100dvh;
      max-width: 960px;
      margin: 0 auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow: hidden;
    }

    .room-header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 14px;
    }

    .room-info-strip {
      flex-shrink: 0;
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      gap: 8px;
    }

    .info-card {
      padding: 10px 13px;
      border-radius: 14px;
      background: rgba(9, 28, 37, 0.84);
      border: 1px solid rgba(94, 234, 212, 0.25);
    }
    .info-card.secret-card {
      background: linear-gradient(135deg, rgba(13, 148, 136, 0.2), rgba(7, 26, 36, 0.88));
      border-color: rgba(45, 212, 191, 0.45);
    }
    .info-mini-label {
      font-size: 10.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .info-main-text {
      font-size: 15.5px;
      font-weight: 800;
      color: #fff;
      margin-top: 2px;
    }
    .info-sub-text {
      font-size: 12px;
      color: #cbd5e1;
      margin-top: 3px;
      line-height: 1.38;
    }
    .fact-list {
      margin-top: 5px;
      padding-left: 15px;
      font-size: 11.5px;
      color: #cffafe;
      line-height: 1.4;
    }
    .secret-blurred { filter: blur(7px); user-select: none; }
    .mobile-only-hint { display: none; }

    /* KHUNG CHAT CỐ ĐỊNH GIỐNG FACEBOOK MESSENGER */
    .chat-shell {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: 16px;
    }

    .chat-subheader {
      flex-shrink: 0;
      padding: 8px 14px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.16);
      background: rgba(5, 19, 26, 0.65);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12.5px;
    }

    .chat-messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    .chat-messages::-webkit-scrollbar { width: 6px; }
    .chat-messages::-webkit-scrollbar-thumb {
      background: rgba(94, 234, 212, 0.25);
      border-radius: 999px;
    }

    .msg-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      max-width: 86%;
    }
    .msg-row.mine {
      align-self: flex-end;
      flex-direction: row-reverse;
    }
    .msg-row.other {
      align-self: flex-start;
    }
    .msg-av {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .msg-col {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .msg-row.mine .msg-col { align-items: flex-end; }
    .msg-row.other .msg-col { align-items: flex-start; }

    .msg-sender {
      font-size: 11px;
      color: var(--muted);
      padding: 0 6px;
    }

    .msg-bubble {
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.45;
      word-break: break-word;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.22);
    }
    .msg-row.mine .msg-bubble {
      background: linear-gradient(135deg, #0d9488, #0284c7);
      color: #fff;
      border-bottom-right-radius: 5px;
    }
    .msg-row.other .msg-bubble {
      background: rgba(30, 41, 59, 0.92);
      border: 1px solid rgba(148, 163, 184, 0.22);
      color: #f1f5f9;
      border-bottom-left-radius: 5px;
    }
    .msg-bubble.guess-bubble {
      background: linear-gradient(135deg, rgba(217, 119, 6, 0.92), rgba(234, 88, 12, 0.92)) !important;
      color: #fff !important;
      border: 1px solid rgba(253, 224, 71, 0.45);
    }
    .msg-taunt {
      font-size: 11.5px;
      color: #c4b5fd;
      margin-top: 4px;
      font-style: italic;
    }

    .reply-chip {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid transparent;
    }
    .reply-YES { background: rgba(34, 197, 94, 0.2); border-color: rgba(74, 222, 128, 0.35); color: #86efac; }
    .reply-NO { background: rgba(239, 68, 68, 0.2); border-color: rgba(248, 113, 113, 0.35); color: #fca5a5; }
    .reply-MAYBE { background: rgba(234, 179, 8, 0.2); border-color: rgba(250, 204, 21, 0.35); color: #fde047; }
    .reply-PROBABLY_NO { background: rgba(249, 115, 22, 0.22); border-color: rgba(251, 146, 60, 0.4); color: #fdba74; }
    .reply-DONT_KNOW { background: rgba(148, 163, 184, 0.2); border-color: rgba(148, 163, 184, 0.35); color: #cbd5e1; }
    .reply-note { font-weight: 500; color: #e2e8f0; }

    .judge-banner {
      align-self: center;
      max-width: 92%;
      padding: 8px 14px;
      border-radius: 14px;
      font-size: 12.5px;
      font-weight: 700;
      text-align: center;
      line-height: 1.45;
    }
    .judge-win {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.26), rgba(16, 185, 129, 0.24));
      border: 1px solid var(--gold);
      color: #fef3c7;
    }
    .judge-miss {
      background: rgba(239, 68, 68, 0.14);
      border: 1px solid rgba(248, 113, 113, 0.32);
      color: #fecaca;
    }
    .judge-sys {
      background: rgba(45, 212, 191, 0.12);
      border: 1px solid rgba(94, 234, 212, 0.25);
      color: #a5f3fc;
    }
    .judge-hint {
      background: rgba(251, 191, 36, 0.14);
      border: 1px dashed rgba(251, 191, 36, 0.55);
      color: #fef08a;
    }

    .chat-composer {
      flex-shrink: 0;
      padding: 10px 12px;
      border-top: 1px solid rgba(94, 234, 212, 0.22);
      background: var(--glass-strong);
    }

    .composer-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    .composer-tab {
      flex: 1;
      padding: 7px 10px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.05);
      color: #cbd5e1;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
    }
    .composer-tab.active-ask {
      background: rgba(20, 184, 166, 0.25);
      border-color: var(--accent);
      color: #5eead4;
    }
    .composer-tab.active-guess {
      background: rgba(245, 158, 11, 0.25);
      border-color: var(--gold);
      color: #fde68a;
    }

    .quick-strip {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 6px;
      scrollbar-width: none;
    }
    .quick-strip::-webkit-scrollbar { display: none; }
    .chip {
      flex-shrink: 0;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 11.5px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #e2e8f0;
      cursor: pointer;
    }
    .chip:hover { background: rgba(45, 212, 191, 0.22); border-color: var(--accent); }

    .input-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    /* ================= TỐI ƯU RIÊNG CHO ĐIỆN THOẠI (MAXIMIZE KHUNG CHAT) ================= */
    @media (max-width: 700px) {
      #roomScreen {
        padding: 4px 5px;
        gap: 4px;
      }

      .room-header {
        padding: 5px 8px;
        border-radius: 10px;
      }
      #roomTitle { font-size: 13px !important; }
      #roomBadges .pill { padding: 1px 6px; font-size: 10px; }

      .room-info-strip {
        grid-template-columns: 1fr 1fr;
        gap: 5px;
      }
      .info-card {
        padding: 6px 8px;
        border-radius: 10px;
        cursor: pointer;
      }
      .info-mini-label {
        font-size: 9.5px;
        letter-spacing: 0.3px;
      }
      .info-main-text {
        font-size: 12.5px;
        line-height: 1.25;
        margin-top: 2px;
      }
      .info-sub-text {
        font-size: 11px;
        line-height: 1.3;
      }
      .mobile-only-hint {
        display: inline;
        font-size: 10px;
        opacity: 0.8;
      }
      .topic-desc-mobile-hide {
        display: none;
      }

      .chat-shell {
        border-radius: 12px;
      }
      .chat-subheader {
        padding: 5px 8px;
        font-size: 11px;
      }
      .chat-messages {
        padding: 10px 8px;
        gap: 9px;
      }
      .msg-row {
        max-width: 92%;
        gap: 6px;
      }
      .msg-av {
        width: 26px;
        height: 26px;
        font-size: 14px;
      }
      .msg-bubble {
        padding: 8px 12px;
        font-size: 13.5px;
      }
      .reply-chip {
        padding: 4px 8px;
        font-size: 11.5px;
      }
      .judge-banner {
        padding: 6px 10px;
        font-size: 12px;
      }

      .chat-composer {
        padding: 6px 8px;
      }
      .composer-tabs {
        gap: 4px;
        margin-bottom: 5px;
      }
      .composer-tab {
        padding: 5px 6px;
        font-size: 11.5px;
        border-radius: 8px;
      }
      .quick-strip {
        padding-bottom: 4px;
        margin-bottom: 4px;
        gap: 5px;
      }
      .chip {
        padding: 3px 8px;
        font-size: 11px;
      }
      .input-row {
        gap: 6px;
      }
      .input-row input {
        padding: 8px 10px;
        font-size: 13.5px;
        border-radius: 10px;
      }
      .input-row .btn {
        padding: 8px 12px;
        font-size: 13px;
        border-radius: 10px;
      }

      .ans-prompt-label {
        font-size: 11px !important;
        margin-bottom: 4px !important;
      }
      .ans-note-wrap {
        margin-bottom: 5px !important;
      }
      .ans-note-wrap input {
        padding: 6px 9px !important;
        font-size: 12px !important;
      }
      .ans-btn-row {
        grid-template-columns: repeat(3, 1fr);
        gap: 4px;
      }
      .ans-btn-row .btn {
        padding: 7px 4px;
        font-size: 11.5px;
        border-radius: 9px;
      }
      .guess-hint-line {
        font-size: 10.5px !important;
        margin-bottom: 4px !important;
      }

      #chatBubble {
        width: 50px;
        height: 50px;
        right: 10px;
        bottom: 66px;
      }
    }

    /* ================= BONG BÓNG "CHAT" KÉO THẢ ================= */
    #chatBubble {
      position: fixed;
      right: 18px;
      bottom: 84px;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0d9488, #0284c7);
      border: 2px solid rgba(94, 234, 212, 0.9);
      box-shadow: 0 8px 26px rgba(0, 0, 0, 0.55);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: grab;
      z-index: 999;
      user-select: none;
      touch-action: none;
      color: #fff;
    }
    #chatBubble:active { cursor: grabbing; transform: scale(0.95); }
    .bubble-label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.3px;
      margin-top: -1px;
    }
    .bubble-unread {
      position: absolute;
      top: -3px;
      right: -3px;
      min-width: 20px;
      height: 20px;
      padding: 0 5px;
      border-radius: 999px;
      background: #ef4444;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #041016;
    }

    #chatDrawer {
      position: fixed;
      right: 14px;
      bottom: 78px;
      width: min(360px, calc(100vw - 24px));
      height: min(470px, calc(100dvh - 110px));
      z-index: 1000;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: rgba(7, 25, 34, 0.96);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid rgba(94, 234, 212, 0.45);
      border-radius: 18px;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.65);
    }
    .drawer-head {
      padding: 10px 12px;
      background: rgba(13, 148, 136, 0.22);
      border-bottom: 1px solid rgba(94, 234, 212, 0.22);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 13.5px;
      font-weight: 800;
    }
    .drawer-tabs {
      display: flex;
      gap: 6px;
      padding: 8px 12px 0;
    }
    .drawer-tab {
      flex: 1;
      padding: 7px 8px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.05);
      color: #cbd5e1;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .drawer-tab.active {
      background: rgba(45, 212, 191, 0.24);
      border-color: var(--accent);
      color: #5eead4;
    }
    .drawer-body {
      flex: 1;
      min-height: 0;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow: hidden;
    }
    .drawer-chat-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 8px;
      border-radius: 12px;
      background: rgba(4, 14, 20, 0.72);
      display: flex;
      flex-direction: column;
      gap: 7px;
      font-size: 12.5px;
      line-height: 1.4;
    }

    .pulse { display: inline-block; animation: pulseAnim 1.2s infinite; }
    @keyframes pulseAnim { 0%,100% { opacity: 1; } 50% { opacity: 0.42; } }

    .typing-dots span {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #94a3b8;
      margin: 0 2px;
      animation: bounceDot 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounceDot {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40% { transform: translateY(-4px); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- ================= MÀN HÌNH NHẬP TÊN VÀO LUÔN ================= -->
  <div id="authScreen">
    <div class="glass auth-card">
      <div class="brand-title">🕵️‍♂️ LÀ ẢI LÀ AI?</div>
      <div class="brand-sub">Nhập tên là vào chơi ngay • Không cần tạo tài khoản</div>

      <div id="authError" class="err-msg hidden"></div>

      <div class="form-group">
        <label>Tên hiển thị của bạn</label>
        <input id="authName" type="text" placeholder="Ví dụ: Thám Tử Conan, Bé Na..." maxlength="24" autofocus />
      </div>

      <div class="form-group">
        <label>Chọn biểu tượng đại diện</label>
        <div class="avatar-picker" id="avatarPicker"></div>
      </div>

      <button class="btn btn-primary" style="width:100%; padding:13px; font-size:15px;" onclick="enterLobby()">
        🚀 Vào Sảnh Ngay
      </button>
    </div>
  </div>

  <!-- ================= MÀN HÌNH SẢNH CHỜ ================= -->
  <div id="lobbyScreen" class="hidden">
    <div class="glass topbar">
      <div class="user-badge">
        <div class="user-avatar" id="meAvatar">🕵️</div>
        <div>
          <div style="font-weight:800; font-size:16px;" id="meName">Người chơi</div>
          <div style="font-size:12px; color:var(--accent);" id="onlineCountBadge">🟢 1 đang online</div>
        </div>
      </div>
      <button class="btn btn-ghost" onclick="logout()">Đổi tên</button>
    </div>

    <div class="glass panel">
      <div class="panel-title"><span>🎮 Tạo Phòng Đấu Mới</span></div>

      <div class="create-box">
        <div>
          <label style="font-size:12px; color:var(--muted); display:block; margin-bottom:5px;">Chủ đề (Quản trò AI chọn không trùng)</label>
          <select id="lobbyTopicPref">
            <option value="hot_drama">🔥 Ưu tiên Nghệ sĩ / Drama Hot VN &amp; Thế giới</option>
            <option value="vn_showbiz">🇻🇳 Showbiz &amp; Drama Việt Nam</option>
            <option value="global_star">🌍 Sao Quốc Tế &amp; Tỷ Phú</option>
            <option value="car_brands">🚗 Các Hãng Xe Hơi Nổi Tiếng</option>
            <option value="history">📜 Nhân Vật Lịch Sử</option>
            <option value="anime_game">🎌 Nhân Vật Anime / Siêu Anh Hùng / Game</option>
            <option value="random">🎲 Ngẫu Nhiên Đủ Mọi Chủ Đề (Người &amp; Vật)</option>
          </select>
        </div>
        <div>
          <label style="font-size:12px; color:var(--muted); display:block; margin-bottom:5px;">Độ khó khi đấu AI</label>
          <select id="lobbyAiDifficulty">
            <option value="easy">🟢 Dễ (Có gợi ý + câu hỏi nhanh)</option>
            <option value="hard">🔴 Khó (Tắt toàn bộ gợi ý)</option>
          </select>
        </div>
        <div>
          <label style="font-size:12px; color:var(--muted); display:block; margin-bottom:5px;">Tên phòng (tùy chọn)</label>
          <input id="lobbyRoomName" type="text" placeholder="Ví dụ: Kèo showbiz..." maxlength="32" />
        </div>
      </div>

      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <button class="btn btn-primary" style="flex:1;" onclick="createRoom('pvp')">⚔️ Tạo Phòng 2 Người (Online)</button>
        <button class="btn btn-ai" style="flex:1;" onclick="createRoom('pvai')">🤖 Đấu Ngay Với AI Thám Tử (1vAI)</button>
      </div>
    </div>

    <div class="glass panel">
      <div class="panel-title">
        <span>🏟️ Sảnh Phòng Chờ &amp; Cuộc Chiến Đang Diễn Ra</span>
        <span style="font-size:12px; color:var(--muted);" id="roomCountLabel">0 phòng</span>
      </div>
      <div class="room-list" id="roomList"></div>
    </div>

    <div class="glass panel">
      <div class="panel-title"><span>👥 Đang Online Trong Sảnh</span></div>
      <div id="onlineUsersList" style="display:flex; flex-wrap:wrap; gap:6px;"></div>
    </div>
  </div>

  <!-- ================= MÀN HÌNH PHÒNG ĐẤU ================= -->
  <div id="roomScreen" class="hidden">
    <div class="glass room-header">
      <div style="display:flex; align-items:center; gap:8px; min-width:0;">
        <button class="btn btn-ghost" style="padding:6px 10px; font-size:12px;" onclick="leaveRoom()">← Sảnh</button>
        <div style="min-width:0;">
          <div style="font-weight:800; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;" id="roomTitle">Phòng Đấu</div>
          <div style="display:flex; gap:5px; margin-top:2px; flex-wrap:wrap;" id="roomBadges"></div>
        </div>
      </div>
      <div style="display:flex; align-items:center; gap:5px; flex-wrap:wrap;" id="roomHeaderActions"></div>
    </div>

    <div class="room-info-strip" id="roomInfoStrip"></div>

    <div class="glass chat-shell">
      <div class="chat-subheader" id="chatSubheader"></div>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-composer" id="chatComposer"></div>
    </div>
  </div>

  <!-- ================= BONG BÓNG "CHAT" KÉO THẢ (CÓ Ở CẢ SẢNH & PHÒNG) ================= -->
  <div id="chatBubble" class="hidden" title="Kéo để di chuyển • Bấm để mở Chat">
    <span style="font-size:19px; line-height:1;">💬</span>
    <span class="bubble-label">Chat</span>
    <span class="bubble-unread hidden" id="bubbleUnreadBadge">0</span>
  </div>

  <div id="chatDrawer" class="hidden">
    <div class="drawer-head">
      <span id="drawerTitle">💬 Chat Sảnh Online</span>
      <button class="btn btn-ghost" style="padding:4px 9px; font-size:12px;" onclick="toggleChatDrawer(false)">✕</button>
    </div>

    <div id="drawerTabs" class="drawer-tabs hidden">
      <button class="drawer-tab active" id="dTabLobby" onclick="switchDrawerTab('lobby')">💬 Chat Sảnh</button>
      <button class="drawer-tab" id="dTabSpec" onclick="switchDrawerTab('spectator')">👀 Khán Đài (<span id="drawerSpecCount">0</span>)</button>
    </div>

    <div class="drawer-body">
      <div id="drawerSpoilerWrap" class="hidden">
        <button class="btn btn-gold" style="width:100%; padding:8px; font-size:12.5px;" id="toggleSpoilerBtn" onclick="toggleSpectatorSpoiler()">
          👁️ Bật Soi Đáp Án Cả 2 Bên
        </button>
      </div>
      <div id="drawerSpecList" class="hidden" style="display:flex; flex-wrap:wrap; gap:5px; max-height:54px; overflow-y:auto;"></div>
      <div class="drawer-chat-list" id="drawerChatList"></div>
      <div id="drawerChatInputRow" style="display:flex; gap:6px;">
        <input id="drawerChatInput" type="text" placeholder="Nhập tin nhắn..." maxlength="200"
               style="padding:9px 11px; font-size:13px;"
               onkeydown="if(event.key==='Enter') sendDrawerChat()" />
        <button class="btn btn-primary" style="padding:9px 13px;" onclick="sendDrawerChat()">Gửi</button>
      </div>
    </div>
  </div>

  <script>
    const socket = io();

    const AVATARS = ['🕵️', '🦊', '😎', '🧙‍♂️', '🐱', '🦁', '🐼', '👻', '🥷', '🧑‍🚀', '👑', '🔥'];
    const ANSWER_UI = {
      YES: { label: '✅ Có (Yes)', cls: 'reply-YES' },
      NO: { label: '❌ Không (No)', cls: 'reply-NO' },
      MAYBE: { label: '🤔 Có thể', cls: 'reply-MAYBE' },
      PROBABLY_NO: { label: '🤨 Hình như không', cls: 'reply-PROBABLY_NO' },
      DONT_KNOW: { label: '🤷 Không biết', cls: 'reply-DONT_KNOW' }
    };

    let selectedAvatar = '🕵️';
    let me = null;
    let currentRoom = null;
    let lobbyChatMessages = [];

    let spectatorRevealSecrets = false;
    let showFactsExpanded = false;
    let showTopicDescMobile = false;
    let activeComposerTab = 'ask';

    let drawerOpen = false;
    let drawerTab = 'lobby';
    let unreadChatCount = 0;
    let lastLobbyChatLen = 0;
    let lastSpecChatLen = 0;

    let lastComposerRenderKey = '';
    let lastFeedRenderKey = '';

    // Avatar picker
    const pickerEl = document.getElementById('avatarPicker');
    AVATARS.forEach(em => {
      const btn = document.createElement('div');
      btn.className = 'avatar-opt' + (em === selectedAvatar ? ' selected' : '');
      btn.textContent = em;
      btn.onclick = () => {
        selectedAvatar = em;
        document.querySelectorAll('.avatar-opt').forEach(x => x.classList.remove('selected'));
        btn.classList.add('selected');
      };
      pickerEl.appendChild(btn);
    });

    function showAuthError(msg) {
      const el = document.getElementById('authError');
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    function enterLobby() {
      const name = document.getElementById('authName').value.trim();
      socket.emit('enter_lobby', { name, avatar: selectedAvatar }, (res) => {
        if (!res.ok) return showAuthError(res.msg);
        me = res.user;
        lobbyChatMessages = res.lobbyChat || lobbyChatMessages || [];
        lastLobbyChatLen = lobbyChatMessages.length;

        document.getElementById('authScreen').classList.add('hidden');
        document.getElementById('lobbyScreen').classList.remove('hidden');
        document.getElementById('chatBubble').classList.remove('hidden');

        document.getElementById('meAvatar').textContent = me.avatar || '🕵️';
        document.getElementById('meName').textContent = me.name;
        renderLobby(res.lobby);
        renderChatDrawer();
      });
    }

    document.getElementById('authName').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') enterLobby();
    });

    function logout() { location.reload(); }

    // ================= LOBBY & GLOBAL CHAT =================
    socket.on('lobby_update', (lobby) => {
      if (!me) return;
      renderLobby(lobby);
    });

    socket.on('lobby_chat_update', (msgs) => {
      const arr = Array.isArray(msgs) ? msgs : [];
      if (me && arr.length > lastLobbyChatLen) {
        if (!drawerOpen || drawerTab !== 'lobby') {
          unreadChatCount += (arr.length - lastLobbyChatLen);
        }
      }
      lobbyChatMessages = arr;
      lastLobbyChatLen = arr.length;
      if (me) renderChatDrawer();
    });

    function renderLobby(lobby) {
      if (!lobby) return;
      document.getElementById('onlineCountBadge').textContent = `🟢 ${lobby.onlineUsers.length} đang online`;
      document.getElementById('roomCountLabel').textContent = `${lobby.rooms.length} phòng`;

      const roomListEl = document.getElementById('roomList');
      if (lobby.rooms.length === 0) {
        roomListEl.innerHTML = `<div style="text-align:center; color:var(--muted); padding:26px; font-size:13.5px;">Chưa có phòng nào đang mở. Hãy tạo phòng 2 người hoặc đấu ngay với AI Thám Tử!</div>`;
      } else {
        roomListEl.innerHTML = lobby.rooms.map(r => {
          const modePill = r.mode === 'pvai'
            ? `<span class="pill pill-ai">🤖 1vAI</span> <span class="pill ${r.difficulty === 'hard' ? 'pill-hard' : 'pill-easy'}">${r.difficulty === 'hard' ? '🔴 Khó' : '🟢 Dễ'}</span>`
            : `<span class="pill pill-pvp">⚔️ 2 Người</span>`;
          let statusPill = `<span class="pill pill-wait">⏳ Đang chờ</span>`;
          if (r.status === 'playing' || r.status === 'generating') statusPill = `<span class="pill pill-play">🔥 Đang chiến</span>`;
          else if (r.status === 'finished') statusPill = `<span class="pill pill-done">🏁 Đã xong</span>`;

          const p1Label = r.p1 ? `${r.p1.avatar} ${escapeHtml(r.p1.name)}` : 'Trống';
          const p2Label = r.p2 ? `${r.p2.avatar} ${escapeHtml(r.p2.name)}` : 'Chờ đối thủ...';
          const topicLine = r.topicName ? `<div style="font-size:12px; color:var(--accent); margin-top:3px;">🎯 ${escapeHtml(r.topicName)}</div>` : '';
          const canJoinFight = r.mode === 'pvp' && !r.p2 && r.status === 'waiting';

          return `
            <div class="room-item">
              <div>
                <div style="font-weight:700; font-size:14.5px; margin-bottom:4px;">${escapeHtml(r.name)}</div>
                <div style="display:flex; gap:5px; flex-wrap:wrap; margin-bottom:5px;">
                  ${modePill} ${statusPill}
                  <span class="pill pill-done">👀 ${r.spectatorCount} xem</span>
                </div>
                <div style="font-size:12.5px; color:#cbd5e1;">${p1Label} <b>vs</b> ${p2Label}</div>
                ${topicLine}
              </div>
              <div style="display:flex; gap:8px;">
                ${canJoinFight ? `<button class="btn btn-primary" onclick="joinRoom('${r.id}', false)">⚔️ Vào Đấu</button>` : ''}
                <button class="btn btn-ghost" onclick="joinRoom('${r.id}', true)">👁️ Xem Chiến</button>
              </div>
            </div>
          `;
        }).join('');
      }

      const onlineEl = document.getElementById('onlineUsersList');
      onlineEl.innerHTML = lobby.onlineUsers.map(u => `
        <span class="pill ${u.inRoom ? 'pill-play' : 'pill-done'}">${u.avatar} ${escapeHtml(u.name)}</span>
      `).join('');
    }

    function createRoom(mode) {
      const topicPref = document.getElementById('lobbyTopicPref').value;
      const difficulty = document.getElementById('lobbyAiDifficulty').value;
      const roomName = document.getElementById('lobbyRoomName').value.trim();
      socket.emit('create_room', { mode, difficulty, topicPref, roomName }, (res) => {
        if (!res.ok) return alert(res.msg);
        enterRoomView(res.room);
      });
    }

    function joinRoom(roomId, asSpectator) {
      socket.emit('join_room', { roomId, asSpectator }, (res) => {
        if (!res.ok) return alert(res.msg);
        enterRoomView(res.room);
      });
    }

    function enterRoomView(room) {
      currentRoom = room;
      spectatorRevealSecrets = false;
      showFactsExpanded = false;
      showTopicDescMobile = false;
      activeComposerTab = 'ask';
      drawerOpen = false;
      drawerTab = room.role === 'spectator' ? 'spectator' : 'lobby';
      lastSpecChatLen = (room.spectatorChat || []).length;
      lastComposerRenderKey = '';
      lastFeedRenderKey = '';

      document.getElementById('lobbyScreen').classList.add('hidden');
      document.getElementById('roomScreen').classList.remove('hidden');
      document.getElementById('chatDrawer').classList.add('hidden');
      renderRoom(room);
    }

    function leaveRoom() {
      socket.emit('leave_room');
      currentRoom = null;
      drawerTab = 'lobby';
      drawerOpen = false;
      document.getElementById('roomScreen').classList.add('hidden');
      document.getElementById('chatDrawer').classList.add('hidden');
      document.getElementById('lobbyScreen').classList.remove('hidden');
      renderChatDrawer();
    }

    socket.on('room_update', (room) => {
      const newSpecLen = (room.spectatorChat || []).length;
      if (newSpecLen > lastSpecChatLen) {
        if (!drawerOpen || drawerTab !== 'spectator') {
          unreadChatCount += (newSpecLen - lastSpecChatLen);
        }
      }
      lastSpecChatLen = newSpecLen;
      currentRoom = room;
      renderRoom(room);
    });

    socket.on('kicked_to_lobby', (msg) => {
      alert(msg);
      leaveRoom();
    });

    // ================= RENDER PHÒNG ĐẤU =================
    function renderRoom(room) {
      document.getElementById('roomTitle').textContent = room.name;

      const badges = [];
      if (room.mode === 'pvai') {
        badges.push(`<span class="pill pill-ai">🤖 1vAI</span>`);
        badges.push(room.difficulty === 'hard'
          ? `<span class="pill pill-hard">🔴 Khó</span>`
          : `<span class="pill pill-easy">🟢 Dễ</span>`);
      } else {
        badges.push(`<span class="pill pill-pvp">⚔️ 2 Người</span>`);
      }
      badges.push(room.role === 'spectator'
        ? `<span class="pill pill-wait">👁️ Khán giả</span>`
        : `<span class="pill pill-play">🎮 Đấu thủ</span>`);
      document.getElementById('roomBadges').innerHTML = badges.join('');

      const headerActions = document.getElementById('roomHeaderActions');
      const isHost = room.hostId === socket.id;
      if (isHost && (room.status === 'waiting' || room.status === 'finished')) {
        const diffSelect = room.mode === 'pvai' ? `
          <select style="width:auto; padding:5px 7px; font-size:11.5px;" onchange="changeRoomDifficulty(this.value)">
            <option value="easy" ${room.difficulty==='easy'?'selected':''}>🟢 Dễ</option>
            <option value="hard" ${room.difficulty==='hard'?'selected':''}>🔴 Khó</option>
          </select>
        ` : '';
        headerActions.innerHTML = `
          ${diffSelect}
          <select style="width:auto; padding:5px 8px; font-size:11.5px;" onchange="changeRoomTopicPref(this.value)">
            <option value="hot_drama" ${room.topicPref==='hot_drama'?'selected':''}>🔥 Drama/Hot</option>
            <option value="vn_showbiz" ${room.topicPref==='vn_showbiz'?'selected':''}>🇻🇳 Showbiz VN</option>
            <option value="global_star" ${room.topicPref==='global_star'?'selected':''}>🌍 Sao Quốc Tế</option>
            <option value="car_brands" ${room.topicPref==='car_brands'?'selected':''}>🚗 Hãng Xe</option>
            <option value="history" ${room.topicPref==='history'?'selected':''}>📜 Lịch Sử</option>
            <option value="anime_game" ${room.topicPref==='anime_game'?'selected':''}>🎌 Anime/Game</option>
            <option value="random" ${room.topicPref==='random'?'selected':''}>🎲 Ngẫu Nhiên</option>
          </select>
        `;
      } else {
        headerActions.innerHTML = '';
      }

      renderInfoStrip(room);
      renderChatSubheader(room);
      renderChatMessages(room);
      renderChatComposer(room);
      renderChatDrawer();
    }

    function renderInfoStrip(room) {
      const strip = document.getElementById('roomInfoStrip');

      let topicHtml = '';
      if (room.status === 'generating') {
        topicHtml = `
          <div class="info-card">
            <div class="info-mini-label">🎯 CHỦ ĐỀ</div>
            <div class="info-main-text pulse">🎲 Đang bốc...</div>
          </div>
        `;
      } else if (room.topic && room.topic.name) {
        topicHtml = `
          <div class="info-card" onclick="toggleTopicDescMobile()">
            <div class="info-mini-label">
              <span>🎯 CHỦ ĐỀ</span>
              <span class="mobile-only-hint">${showTopicDescMobile ? '▲' : '▼'}</span>
            </div>
            <div class="info-main-text">${escapeHtml(room.topic.name)}</div>
            <div class="info-sub-text ${showTopicDescMobile ? '' : 'topic-desc-mobile-hide'}">${escapeHtml(room.topic.description)}</div>
          </div>
        `;
      } else {
        topicHtml = `
          <div class="info-card">
            <div class="info-mini-label">🎯 CHỦ ĐỀ</div>
            <div class="info-main-text">Chờ bắt đầu</div>
            <div class="info-sub-text topic-desc-mobile-hide">Quản trò AI sẽ bốc chủ đề và 2 đối tượng bí mật ngay khi mở màn.</div>
          </div>
        `;
      }

      let secretHtml = '';
      if (room.role === 'p1' || room.role === 'p2') {
        const myPl = room.players[room.role];
        const oppSide = room.role === 'p1' ? 'p2' : 'p1';
        const oppPl = room.players[oppSide];

        if (room.status === 'finished' && myPl?.secret && oppPl?.secret) {
          secretHtml = `
            <div class="info-card secret-card">
              <div class="info-mini-label">🔓 ĐÁP ÁN</div>
              <div class="info-sub-text" style="margin-top:2px;">
                Bạn: <b style="color:#fff;">${escapeHtml(myPl.secret.name)}</b><br/>
                Địch: <b style="color:#fde047;">${escapeHtml(oppPl.secret.name)}</b>
              </div>
            </div>
          `;
        } else if (myPl && myPl.secret) {
          const facts = (myPl.secret.facts || []).map(f => `<li>${escapeHtml(f)}</li>`).join('');
          secretHtml = `
            <div class="info-card secret-card" onclick="toggleFacts()">
              <div class="info-mini-label">
                <span>🔐 THẺ CỦA BẠN</span>
                ${facts ? `<span style="font-size:10px; color:#5eead4;">${showFactsExpanded ? 'Ẩn ▲' : 'Thông tin ▼'}</span>` : ''}
              </div>
              <div class="info-main-text" style="color:#5eead4;">${escapeHtml(myPl.secret.name)}</div>
              ${showFactsExpanded && facts ? `<ul class="fact-list">${facts}</ul>` : ''}
            </div>
          `;
        } else {
          secretHtml = `
            <div class="info-card secret-card">
              <div class="info-mini-label">🔐 THẺ BÍ MẬT</div>
              <div class="info-sub-text">Chưa phát thẻ</div>
            </div>
          `;
        }
      } else {
        const p1 = room.players.p1;
        const p2 = room.players.p2;
        const isBlur = room.status === 'playing' && !spectatorRevealSecrets;
        secretHtml = `
          <div class="info-card secret-card" onclick="toggleSpectatorSpoiler()">
            <div class="info-mini-label">
              <span>👁️ ĐÁP ÁN 2 BÊN</span>
              ${room.status === 'playing' ? `<span style="font-size:10px; color:#fde047;">${spectatorRevealSecrets ? 'Ẩn' : 'Soi'}</span>` : ''}
            </div>
            <div class="info-sub-text ${isBlur ? 'secret-blurred' : ''}" style="margin-top:2px;">
              ${p1 ? `${p1.avatar} <b style="color:#5eead4;">${escapeHtml(p1.secret?.name || '---')}</b>` : '---'}<br/>
              ${p2 ? `${p2.avatar} <b style="color:#fde047;">${escapeHtml(p2.secret?.name || '---')}</b>` : '---'}
            </div>
          </div>
        `;
      }

      strip.innerHTML = topicHtml + secretHtml;
    }

    function renderChatSubheader(room) {
      const el = document.getElementById('chatSubheader');
      const p1 = room.players.p1;
      const p2 = room.players.p2;
      const p1Txt = p1 ? `${p1.avatar} <b>${escapeHtml(p1.name)}</b>` : 'Chờ P1...';
      const p2Txt = p2 ? `${p2.avatar} <b>${escapeHtml(p2.name)}</b>` : 'Chờ đối thủ...';

      let turnBadge = `<span class="pill pill-done">${room.qaHistory.length} lượt</span>`;
      if (room.status === 'playing') {
        const turnPl = room.players[room.turnSide];
        const respPl = room.players[room.turnSide === 'p1' ? 'p2' : 'p1'];
        if (room.judgingGuess) {
          turnBadge = `<span class="pill pill-wait pulse">⚖️ Đang chấm...</span>`;
        } else if (room.aiThinking) {
          turnBadge = `<span class="pill pill-ai pulse">🤖 AI suy luận...</span>`;
        } else if (room.turnPhase === 'asking') {
          turnBadge = `<span class="pill pill-play">❓ Lượt ${escapeHtml(turnPl?.name || '')}</span>`;
        } else {
          turnBadge = `<span class="pill pill-wait">💬 Chờ ${escapeHtml(respPl?.name || '')}</span>`;
        }
      } else if (room.status === 'finished') {
        turnBadge = `<span class="pill pill-wait">🏆 Kết thúc</span>`;
      }

      // Nút Gợi ý chỉ hiện ở chế độ 1vAI - Dễ khi đang chơi
      let hintBtnHtml = '';
      if (room.mode === 'pvai' && room.difficulty === 'easy' && room.role === 'p1' && room.status === 'playing' && room.maxHints > 0) {
        const left = room.maxHints - (room.hintsRevealed || 0);
        hintBtnHtml = `
          <button class="btn btn-hint" ${left <= 0 ? 'disabled' : ''} onclick="requestHint()" title="Mở thêm gợi ý về nhân vật của AI">
            💡 Gợi ý (${room.hintsRevealed}/${room.maxHints})
          </button>
        `;
      }

      el.innerHTML = `
        <div style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${p1Txt} <span style="color:var(--muted);">vs</span> ${p2Txt}</div>
        <div style="display:flex; align-items:center; gap:6px; flex-shrink:0;">
          ${hintBtnHtml}
          ${turnBadge}
        </div>
      `;
    }

    function renderChatMessages(room) {
      const feedKey = JSON.stringify({
        st: room.status,
        len: room.qaHistory.length,
        pq: room.pendingQuestion?.id || null,
        ai: room.aiThinking,
        jg: room.judgingGuess,
        win: room.winnerSide,
        role: room.role,
        diff: room.difficulty
      });
      if (feedKey === lastFeedRenderKey) return;

      const box = document.getElementById('chatMessages');
      const wasNearBottom = (box.scrollHeight - box.scrollTop - box.clientHeight) < 90;
      const prevLen = lastFeedRenderKey ? (JSON.parse(lastFeedRenderKey).len || 0) : 0;
      lastFeedRenderKey = feedKey;

      const parts = [];

      if (room.status === 'waiting') {
        parts.push(`<div class="judge-banner judge-sys">🏟️ Phòng chờ đã mở! Khi đủ 2 đấu thủ, chủ phòng bấm <b>Bắt Đầu</b> để Quản trò AI phát thẻ.</div>`);
      } else if (room.status === 'generating') {
        parts.push(`<div class="judge-banner judge-sys pulse">🎲 Quản trò AI đang chọn chủ đề và bốc 2 nhân vật bí mật hoàn toàn mới...</div>`);
      } else if (room.topic?.name) {
        const diffNote = room.mode === 'pvai'
          ? (room.difficulty === 'hard' ? ' • Chế độ 🔴 Khó (Tắt gợi ý)' : ' • Chế độ 🟢 Dễ (Có nút 💡 Gợi ý ở góc trên)')
          : '';
        parts.push(`<div class="judge-banner judge-sys">🎬 Trận đấu bắt đầu! Chủ đề: <b>${escapeHtml(room.topic.name)}</b>${diffNote}</div>`);
      }

      let qCounter = 0;
      room.qaHistory.forEach((item) => {
        if (item.isHint) {
          parts.push(`
            <div class="judge-banner judge-hint">
              💡 <b>Gợi ý #${item.hintIndex} về nhân vật của AI:</b> ${escapeHtml(item.text)}
            </div>
          `);
          return;
        }

        const isMine = (room.role === 'p1' || room.role === 'p2')
          ? (item.bySide === room.role)
          : (item.bySide === 'p1');
        const pl = room.players[item.bySide];
        const av = pl?.avatar || (item.bySide === 'p2' ? '🤖' : '🕵️');

        if (item.isGuess) {
          parts.push(`
            <div class="msg-row ${isMine ? 'mine' : 'other'}">
              <div class="msg-av">${av}</div>
              <div class="msg-col">
                <div class="msg-sender">🎯 ${escapeHtml(item.byName)} chốt đáp án</div>
                <div class="msg-bubble guess-bubble">
                  <b>Chốt đáp án: "${escapeHtml(item.question)}"</b>
                  ${item.taunt ? `<div class="msg-taunt" style="color:#fef3c7;">💭 ${escapeHtml(item.taunt)}</div>` : ''}
                </div>
              </div>
            </div>
            <div class="judge-banner ${item.guessCorrect ? 'judge-win' : 'judge-miss'}">
              ${escapeHtml(item.judgeAnnouncement || (item.guessCorrect ? '🎉 Chính xác!' : '❌ Chưa chính xác!'))}
            </div>
          `);
        } else {
          qCounter += 1;
          const ansMeta = ANSWER_UI[item.answer] || ANSWER_UI.MAYBE;
          parts.push(`
            <div class="msg-row ${isMine ? 'mine' : 'other'}">
              <div class="msg-av">${av}</div>
              <div class="msg-col">
                <div class="msg-sender">#${qCounter} • ${escapeHtml(item.byName)}</div>
                <div class="msg-bubble">
                  ${escapeHtml(item.question)}
                  ${item.taunt ? `<div class="msg-taunt">💭 ${escapeHtml(item.taunt)}</div>` : ''}
                </div>
                <div class="reply-chip ${ansMeta.cls}">
                  <span>${ansMeta.label}</span>
                  ${item.answerNote ? `<span class="reply-note">— ${escapeHtml(item.answerNote)}</span>` : ''}
                </div>
              </div>
            </div>
          `);
        }
      });

      if (room.pendingQuestion) {
        const pq = room.pendingQuestion;
        const isMine = (room.role === 'p1' || room.role === 'p2')
          ? (pq.bySide === room.role)
          : (pq.bySide === 'p1');
        const pl = room.players[pq.bySide];
        const av = pl?.avatar || '🕵️';

        parts.push(`
          <div class="msg-row ${isMine ? 'mine' : 'other'}">
            <div class="msg-av">${av}</div>
            <div class="msg-col">
              <div class="msg-sender">${escapeHtml(pq.byName)} vừa hỏi...</div>
              <div class="msg-bubble">
                ${escapeHtml(pq.text)}
                ${pq.taunt ? `<div class="msg-taunt">💭 ${escapeHtml(pq.taunt)}</div>` : ''}
              </div>
              <div class="reply-chip reply-DONT_KNOW pulse">⏳ Đang chờ trả lời...</div>
            </div>
          </div>
        `);
      }

      if (room.aiThinking) {
        parts.push(`
          <div class="msg-row other">
            <div class="msg-av">🤖</div>
            <div class="msg-col">
              <div class="msg-sender">AI Thám Tử đang suy nghĩ...</div>
              <div class="msg-bubble"><span class="typing-dots"><span></span><span></span><span></span></span></div>
            </div>
          </div>
        `);
      }

      if (room.judgingGuess) {
        parts.push(`<div class="judge-banner judge-sys pulse">⚖️ Quản trò AI đang kiểm tra &amp; chấm đáp án...</div>`);
      }

      if (room.status === 'finished') {
        const winner = room.players[room.winnerSide];
        parts.push(`
          <div class="judge-banner judge-win" style="padding:10px 14px; font-size:13px;">
            🏆 ${winner ? `${winner.avatar} ${escapeHtml(winner.name)} GIÀNH CHIẾN THẮNG!` : 'TRẬN ĐẤU KẾT THÚC!'}<br/>
            <span style="font-weight:500; font-size:12px;">${escapeHtml(room.winReason || '')}</span>
          </div>
        `);
      }

      box.innerHTML = parts.join('');

      if (wasNearBottom || room.qaHistory.length > prevLen || room.pendingQuestion || room.aiThinking || room.judgingGuess) {
        requestAnimationFrame(() => {
          box.scrollTop = box.scrollHeight;
        });
      }
    }

    function renderChatComposer(room) {
      const composerKey = JSON.stringify({
        st: room.status,
        role: room.role,
        host: room.hostId === socket.id,
        p1: Boolean(room.players.p1),
        p2: Boolean(room.players.p2),
        turn: room.turnSide,
        phase: room.turnPhase,
        pq: room.pendingQuestion?.id || null,
        ai: room.aiThinking,
        jg: room.judgingGuess,
        tab: activeComposerTab,
        mode: room.mode,
        diff: room.difficulty
      });
      if (composerKey === lastComposerRenderKey) return;
      lastComposerRenderKey = composerKey;

      const el = document.getElementById('chatComposer');
      const isHost = room.hostId === socket.id;

      if (room.status === 'waiting') {
        const ready = Boolean(room.players.p1 && room.players.p2);
        el.innerHTML = `
          <div style="display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;">
            <span style="font-size:12.5px; color:var(--muted);">
              ${ready ? '🔥 Đã đủ 2 đấu thủ!' : '⏳ Đang chờ người chơi thứ 2...'}
            </span>
            ${isHost
              ? `<button class="btn btn-primary" ${ready ? '' : 'disabled'} onclick="startMatch()">🚀 Bắt Đầu</button>`
              : `<span class="pill pill-wait">Chờ chủ phòng bắt đầu</span>`}
          </div>
        `;
        return;
      }

      if (room.status === 'generating') {
        el.innerHTML = `<div style="text-align:center; font-size:12.5px; color:var(--accent);" class="pulse">🎲 Quản trò AI đang phát thẻ...</div>`;
        return;
      }

      if (room.status === 'finished') {
        el.innerHTML = `
          <div style="display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;">
            <span style="font-size:12.5px; color:#fde68a;">🏁 Ván đấu đã kết thúc!</span>
            ${isHost && room.players.p1 && room.players.p2
              ? `<button class="btn btn-gold" onclick="startMatch()">🔄 Chơi Ván Mới</button>`
              : `<span style="font-size:12px; color:var(--muted);">Chờ chủ phòng mở ván mới...</span>`}
          </div>
        `;
        return;
      }

      if (room.role === 'spectator') {
        el.innerHTML = `
          <div style="display:flex; align-items:center; justify-content:space-between; gap:8px;">
            <span style="font-size:12.5px; color:var(--muted);">👁️ Bạn đang xem trận đấu trực tiếp.</span>
            <button class="btn btn-ghost" style="padding:6px 11px; font-size:12px;" onclick="openSpectatorTab()">💬 Mở Chat</button>
          </div>
        `;
        return;
      }

      if (room.judgingGuess) {
        el.innerHTML = `<div style="text-align:center; font-size:12.5px; color:var(--gold);" class="pulse">⚖️ Quản trò AI đang chấm đáp án...</div>`;
        return;
      }

      if (room.aiThinking) {
        el.innerHTML = `<div style="text-align:center; font-size:12.5px; color:#c4b5fd;" class="pulse">🤖 AI Thám Tử đang xử lý...</div>`;
        return;
      }

      const isMyAskTurn = room.turnSide === room.role && room.turnPhase === 'asking';
      const isMyAnswerTurn = room.turnSide !== room.role && room.turnPhase === 'answering' && room.pendingQuestion;

      if (isMyAnswerTurn) {
        el.innerHTML = `
          <div class="ans-prompt-label" style="font-size:12px; color:var(--gold); font-weight:700; margin-bottom:6px;">
            ⚡ Trả lời câu hỏi của ${escapeHtml(room.pendingQuestion.byName)}:
          </div>
          <div class="ans-note-wrap" style="margin-bottom:7px;">
            <input id="answerNoteInput" type="text" placeholder="Ghi chú ngắn (không bắt buộc)..." maxlength="100" style="padding:8px 11px; font-size:13px;" />
          </div>
          <div class="ans-btn-row">
            <button class="btn btn-ans-YES" onclick="sendAnswer('YES')">✅ Có</button>
            <button class="btn btn-ans-NO" onclick="sendAnswer('NO')">❌ Không</button>
            <button class="btn btn-ans-MAYBE" onclick="sendAnswer('MAYBE')">🤔 Có thể</button>
            <button class="btn btn-ans-PROBABLY_NO" onclick="sendAnswer('PROBABLY_NO')">🤨 Hình như ko</button>
            <button class="btn btn-ans-DONT_KNOW" onclick="sendAnswer('DONT_KNOW')">🤷 Ko biết</button>
          </div>
        `;
        return;
      }

      if (isMyAskTurn) {
        const showQuickChips = !(room.mode === 'pvai' && room.difficulty === 'hard');
        el.innerHTML = `
          <div class="composer-tabs">
            <button class="composer-tab ${activeComposerTab === 'ask' ? 'active-ask' : ''}" onclick="setComposerTab('ask')">
              ❓ Hỏi Yes / No
            </button>
            <button class="composer-tab ${activeComposerTab === 'guess' ? 'active-guess' : ''}" onclick="setComposerTab('guess')">
              🎯 Chốt đáp án (∞)
            </button>
          </div>
          ${activeComposerTab === 'ask' ? `
            ${showQuickChips ? `
              <div class="quick-strip">
                <span class="chip" onclick="fillQuestion('Đối tượng này có phải đến từ Việt Nam không?')">🇻🇳 Việt Nam?</span>
                <span class="chip" onclick="fillQuestion('Nhân vật này có phải là nam giới không?')">👨 Là nam?</span>
                <span class="chip" onclick="fillQuestion('Người này có nổi tiếng trong lĩnh vực âm nhạc không?')">🎵 Âm nhạc?</span>
                <span class="chip" onclick="fillQuestion('Nhân vật này có từng có drama lớn gần đây không?')">🔥 Drama?</span>
                <span class="chip" onclick="fillQuestion('Đối tượng này có phải là con người thật đang còn sống không?')">🧑 Người thật?</span>
                <span class="chip" onclick="fillQuestion('Đối tượng này có xuất xứ từ Châu Á không?')">🌏 Châu Á?</span>
              </div>
            ` : ''}
            <div class="input-row">
              <input id="questionInput" type="text" placeholder="Nhập câu hỏi Yes/No..." maxlength="200"
                     onkeydown="if(event.key==='Enter') sendQuestion()" />
              <button class="btn btn-primary" onclick="sendQuestion()">Gửi</button>
            </div>
          ` : `
            <div class="guess-hint-line" style="font-size:11.5px; color:#fde68a; margin-bottom:6px;">
              ⚖️ Quản trò AI chấm linh hoạt (cả tên thật, biệt danh, không dấu). Đoán vô số lần!
            </div>
            <div class="input-row">
              <input id="guessInput" type="text" placeholder="Nhập tên nhân vật/đối tượng..." maxlength="100"
                     onkeydown="if(event.key==='Enter') sendGuess()" />
              <button class="btn btn-gold" onclick="sendGuess()">🎯 Chốt!</button>
            </div>
          `}
        `;
        return;
      }

      const waitMsg = room.turnPhase === 'answering'
        ? '⏳ Đang chờ đối thủ chọn câu trả lời...'
        : '⏳ Đang tới lượt đối thủ đặt câu hỏi...';
      el.innerHTML = `<div style="text-align:center; font-size:12.5px; color:var(--muted);" class="pulse">${waitMsg}</div>`;
    }

    // ================= BONG BÓNG "CHAT" (SẢNH + KHÁN ĐÀI) =================
    function renderChatDrawer() {
      const unreadBadge = document.getElementById('bubbleUnreadBadge');
      if (!drawerOpen && unreadChatCount > 0) {
        unreadBadge.textContent = unreadChatCount > 9 ? '9+' : unreadChatCount;
        unreadBadge.classList.remove('hidden');
      } else {
        unreadBadge.classList.add('hidden');
      }

      const inRoom = Boolean(currentRoom);
      if (!inRoom) drawerTab = 'lobby';

      document.getElementById('drawerTabs').classList.toggle('hidden', !inRoom);
      document.getElementById('dTabLobby').classList.toggle('active', drawerTab === 'lobby');
      document.getElementById('dTabSpec').classList.toggle('active', drawerTab === 'spectator');

      const specCount = currentRoom ? (currentRoom.spectators || []).length : 0;
      document.getElementById('drawerSpecCount').textContent = specCount;

      const spoilerWrap = document.getElementById('drawerSpoilerWrap');
      const specListEl = document.getElementById('drawerSpecList');
      const chatList = document.getElementById('drawerChatList');
      const inputRow = document.getElementById('drawerChatInputRow');
      const chatInput = document.getElementById('drawerChatInput');

      if (drawerTab === 'lobby') {
        document.getElementById('drawerTitle').textContent = '💬 Chat Sảnh Online';
        spoilerWrap.classList.add('hidden');
        specListEl.classList.add('hidden');
        inputRow.classList.remove('hidden');
        chatInput.placeholder = 'Nhắn tin với mọi người đang online...';

        if (!lobbyChatMessages.length) {
          chatList.innerHTML = `<div style="color:var(--muted); text-align:center; margin-top:26px;">Chưa có tin nhắn nào. Chào mọi người đang online đi nào! 👋</div>`;
        } else {
          chatList.innerHTML = lobbyChatMessages.map(c => `
            <div><b style="color:var(--accent);">${c.avatar} ${escapeHtml(c.name)}:</b> ${escapeHtml(c.text)}</div>
          `).join('');
          chatList.scrollTop = chatList.scrollHeight;
        }
      } else {
        document.getElementById('drawerTitle').textContent = `👀 Khán Đài Phòng (${specCount})`;
        specListEl.classList.remove('hidden');

        if (currentRoom && currentRoom.role === 'spectator' && currentRoom.status === 'playing') {
          spoilerWrap.classList.remove('hidden');
          document.getElementById('toggleSpoilerBtn').textContent = spectatorRevealSecrets
            ? '🙈 Ẩn Đáp Án Để Tự Đoán Cùng'
            : '👁️ Bật Soi Đáp Án Cả 2 Bên';
        } else {
          spoilerWrap.classList.add('hidden');
        }

        specListEl.innerHTML = specCount
          ? currentRoom.spectators.map(s => `<span class="pill pill-done">${s.avatar} ${escapeHtml(s.name)}</span>`).join('')
          : `<span style="font-size:11.5px; color:var(--muted);">Chưa có khán giả nào vào xem.</span>`;

        const isFightingPlayer = currentRoom && currentRoom.role !== 'spectator' && currentRoom.status === 'playing';
        if (isFightingPlayer) {
          chatList.innerHTML = `<div style="color:var(--muted); text-align:center; margin-top:36px; line-height:1.5;">🔒 Chat khán đài tạm khóa với 2 đấu thủ trong lúc thi đấu để tránh lộ đáp án!<br/><span style="color:var(--accent);">Bạn vẫn có thể bấm sang tab "💬 Chat Sảnh" ở trên.</span></div>`;
          inputRow.classList.add('hidden');
        } else {
          inputRow.classList.remove('hidden');
          chatInput.placeholder = 'Cổ vũ trên khán đài phòng này...';
          const sChat = (currentRoom && currentRoom.spectatorChat) || [];
          if (!sChat.length) {
            chatList.innerHTML = `<div style="color:var(--muted); text-align:center; margin-top:24px;">Khán đài đang yên ắng... Cổ vũ đi nào!</div>`;
          } else {
            chatList.innerHTML = sChat.map(c => `
              <div><b style="color:var(--gold);">${c.avatar} ${escapeHtml(c.name)}:</b> ${escapeHtml(c.text)}</div>
            `).join('');
            chatList.scrollTop = chatList.scrollHeight;
          }
        }
      }
    }

    function toggleChatDrawer(forceState) {
      drawerOpen = typeof forceState === 'boolean' ? forceState : !drawerOpen;
      document.getElementById('chatDrawer').classList.toggle('hidden', !drawerOpen);
      if (drawerOpen) {
        unreadChatCount = 0;
        renderChatDrawer();
      }
    }

    function openSpectatorTab() {
      drawerTab = 'spectator';
      toggleChatDrawer(true);
    }

    function switchDrawerTab(tab) {
      drawerTab = tab;
      unreadChatCount = 0;
      renderChatDrawer();
    }

    function sendDrawerChat() {
      const inp = document.getElementById('drawerChatInput');
      const text = inp.value.trim();
      if (!text) return;
      if (drawerTab === 'lobby') {
        socket.emit('lobby_chat', { text });
      } else {
        socket.emit('spectator_chat', { text });
      }
      inp.value = '';
    }

    // Kéo thả bong bóng "Chat" trên cả chuột & cảm ứng
    (function setupDraggableBubble() {
      const bubble = document.getElementById('chatBubble');
      let dragging = false;
      let moved = false;
      let startX = 0, startY = 0;
      let initLeft = 0, initTop = 0;

      const onDown = (clientX, clientY) => {
        dragging = true;
        moved = false;
        const rect = bubble.getBoundingClientRect();
        initLeft = rect.left;
        initTop = rect.top;
        startX = clientX;
        startY = clientY;
        bubble.style.right = 'auto';
        bubble.style.bottom = 'auto';
        bubble.style.left = initLeft + 'px';
        bubble.style.top = initTop + 'px';
      };

      const onMove = (clientX, clientY) => {
        if (!dragging) return;
        const dx = clientX - startX;
        const dy = clientY - startY;
        if (Math.abs(dx) > 5 || Math.abs(dy) > 5) moved = true;
        const maxLeft = window.innerWidth - bubble.offsetWidth - 8;
        const maxTop = window.innerHeight - bubble.offsetHeight - 8;
        bubble.style.left = Math.max(8, Math.min(maxLeft, initLeft + dx)) + 'px';
        bubble.style.top = Math.max(8, Math.min(maxTop, initTop + dy)) + 'px';
      };

      const onUp = () => {
        if (!dragging) return;
        dragging = false;
        if (!moved) toggleChatDrawer();
      };

      bubble.addEventListener('mousedown', (e) => { e.preventDefault(); onDown(e.clientX, e.clientY); });
      window.addEventListener('mousemove', (e) => onMove(e.clientX, e.clientY));
      window.addEventListener('mouseup', onUp);

      bubble.addEventListener('touchstart', (e) => {
        const t = e.touches[0];
        onDown(t.clientX, t.clientY);
      }, { passive: true });
      window.addEventListener('touchmove', (e) => {
        if (!dragging) return;
        const t = e.touches[0];
        onMove(t.clientX, t.clientY);
      }, { passive: true });
      window.addEventListener('touchend', onUp);
    })();

    // ================= ROOM ACTIONS =================
    function changeRoomTopicPref(val) { socket.emit('update_topic_pref', { topicPref: val }); }
    function changeRoomDifficulty(val) { socket.emit('update_difficulty', { difficulty: val }); }
    function startMatch() { socket.emit('start_match', {}, (res) => { if (res && !res.ok) alert(res.msg); }); }

    function requestHint() {
      socket.emit('request_hint', {}, (res) => {
        if (res && !res.ok) alert(res.msg);
      });
    }

    function toggleTopicDescMobile() {
      showTopicDescMobile = !showTopicDescMobile;
      if (currentRoom) renderInfoStrip(currentRoom);
    }

    function toggleFacts() {
      showFactsExpanded = !showFactsExpanded;
      if (currentRoom) renderInfoStrip(currentRoom);
    }

    function toggleSpectatorSpoiler() {
      spectatorRevealSecrets = !spectatorRevealSecrets;
      if (currentRoom) {
        renderInfoStrip(currentRoom);
        renderChatDrawer();
      }
    }

    function setComposerTab(tab) {
      activeComposerTab = tab;
      lastComposerRenderKey = '';
      if (currentRoom) renderChatComposer(currentRoom);
    }

    function fillQuestion(q) {
      const inp = document.getElementById('questionInput');
      if (inp) { inp.value = q; inp.focus(); }
    }

    function sendQuestion() {
      const inp = document.getElementById('questionInput');
      if (!inp) return;
      const text = inp.value.trim();
      if (!text) return;
      inp.value = '';
      socket.emit('ask_question', { text }, (res) => {
        if (res && !res.ok) alert(res.msg);
      });
    }

    function sendAnswer(answer) {
      const note = document.getElementById('answerNoteInput')?.value.trim() || '';
      socket.emit('answer_question', { answer, note }, (res) => {
        if (res && !res.ok) alert(res.msg);
      });
    }

    function sendGuess() {
      const inp = document.getElementById('guessInput');
      if (!inp) return;
      const guessText = inp.value.trim();
      if (!guessText) return;
      inp.value = '';
      socket.emit('submit_guess', { guessText }, (res) => {
        if (res && !res.ok) alert(res.msg);
      });
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
